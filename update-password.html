<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Update Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f0f2f5;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .container {
            max-width: 400px;
            width: 90%;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: var(--pearl-green);
            transition: background-color 0.3s;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            font-weight: 700;
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        input[type="password"] {
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            line-height: 1.25;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen bg-light-gray">

    <div class="container bg-white">
        <div class="text-center mb-8">
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" class="mx-auto mb-4" width="200" alt="Pearle Vision Logo" onerror="this.onerror=null;this.src='https://placehold.co/200x50/ffffff/000000?text=Logo';">
            <h1 class="text-2xl font-bold text-gray-800">Create a New Password</h1>
        </div>

        <form id="update-password-form">
            <div class="mb-4">
                <label for="new-password" class="block text-gray-700 text-sm font-bold mb-2">New Password</label>
                <input type="password" id="new-password" name="new-password" class="focus:outline-none focus:ring-2 focus:ring-pearl-green focus:border-transparent" required placeholder="******************">
            </div>
            <div class="mb-6">
                <label for="confirm-password" class="block text-gray-700 text-sm font-bold mb-2">Confirm New Password</label>
                <input type="password" id="confirm-password" name="confirm-password" class="focus:outline-none focus:ring-2 focus:ring-pearl-green focus:border-transparent" required placeholder="******************">
            </div>
            <div class="flex items-center justify-between">
                <button class="btn-primary" type="submit">
                    Update Password
                </button>
            </div>
        </form>
        
        <p id="status-message" class="text-center text-xs mt-4">&nbsp;</p>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';

        const updatePasswordForm = document.getElementById('update-password-form');
        const statusMessage = document.getElementById('status-message');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');

        // This page is only useful if the user has a session from a recovery link.
        // We listen for the signed-in event specifically for password recovery.
        supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                // The user is in the password recovery flow.
                // The form submission will handle the password update.
                console.log('Password recovery session detected.');
            }
        });

        updatePasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            const submitButton = updatePasswordForm.querySelector('button[type="submit"]');

            // Basic validation
            if (newPassword.length < 6) {
                statusMessage.textContent = 'Password must be at least 6 characters long.';
                statusMessage.classList.add('text-red-500');
                return;
            }
            if (newPassword !== confirmPassword) {
                statusMessage.textContent = 'Passwords do not match.';
                statusMessage.classList.add('text-red-500');
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = 'Updating...';
            statusMessage.textContent = '';

            // Update the user's password
            const { error } = await supabase.auth.updateUser({
                password: newPassword
            });

            if (error) {
                statusMessage.textContent = `Error: ${error.message}`;
                statusMessage.classList.add('text-red-500');
                submitButton.disabled = false;
                submitButton.textContent = 'Update Password';
            } else {
                statusMessage.textContent = 'Password updated successfully! Redirecting to login...';
                statusMessage.classList.remove('text-red-500');
                statusMessage.classList.add('text-green-600');
                
                // Redirect to the login page after a short delay
                setTimeout(() => {
                    window.location.href = './index.html';
                }, 3000);
            }
        });

    </script>
</body>
</html>
