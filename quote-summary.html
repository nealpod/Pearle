<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Quote Summary</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f8f9fa;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .btn-primary {
            background-color: var(--pearl-green);
            color: white;
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .summary-card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" alt="Pearle Vision Logo" class="h-8">
        </div>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8 flex items-center justify-center">
        <div class="max-w-2xl w-full">
            <div class="summary-card">
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900">Quote Saved!</h1>
                    <p class="text-gray-600 mt-2">Use this summary to enter the order into the Point of Sale system.</p>
                </div>

                <div id="summary-details" class="space-y-6">
                    </div>

                <div class="mt-10 text-center">
                    <button id="new-quote-btn" class="btn-primary font-bold py-3 px-6 rounded-lg text-lg">
                        Start New Quote
                    </button>
                </div>
            </div>
        </div>
    </main>

<script type="module">
    import { supabase } from './supabase-client.js';

    function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    }

    function displaySummary() {
        const summaryDataString = sessionStorage.getItem('currentQuoteSummary');
        const summaryContainer = document.getElementById('summary-details');

        if (!summaryDataString) {
            summaryContainer.innerHTML = '<p class="text-center text-red-500">Could not find quote data. Please go back and try again.</p>';
            return;
        }

        const data = JSON.parse(summaryDataString);
        let detailsHtml = `
            <div>
                <h2 class="text-xl font-semibold text-gray-800 border-b pb-2">Customer: ${data.customerName}</h2>
                <p class="text-right text-2xl font-bold text-pearl-green mt-2">Final Cost: ${formatCurrency(data.finalCost)}</p>
            </div>
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Configuration Details</h3>
                <table class="w-full text-left">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="p-2">Item</th>
                            <th class="p-2">Selection</th>
                            <th class="p-2 text-center">POS Code</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">
        `;

        if (data.frame && data.frame.price > 0) {
            detailsHtml += `
                <tr>
                    <td class="p-2 font-medium">Frame</td>
                    <td class="p-2">Retail Price: ${formatCurrency(data.frame.price)}</td>
                    <td class="p-2 text-center text-gray-500">FRM_GEN</td>
                </tr>
            `;
        }

        data.exams.forEach(exam => {
            detailsHtml += `
                <tr>
                    <td class="p-2 font-medium">${exam.name}</td>
                    <td class="p-2">${exam.selection}</td>
                    <td class="p-2 text-center text-gray-500">EXM_${exam.name.substring(0,3).toUpperCase()}</td>
                </tr>
            `;
        });

        Object.entries(data.lenses).forEach(([key, value]) => {
            detailsHtml += `
                <tr>
                    <td class="p-2 font-medium">${key}</td>
                    <td class="p-2">${value.selection}</td>
                    <td class="p-2 text-center text-gray-500">LNS_${key.substring(0,3).toUpperCase()}</td>
                </tr>
            `;
        });

        data.addOns.forEach(addon => {
            detailsHtml += `
                <tr>
                    <td class="p-2 font-medium">Add-On</td>
                    <td class="p-2">${addon.selection}</td>
                    <td class="p-2 text-center text-gray-500">ADD_${addon.selection.substring(0,3).toUpperCase()}</td>
                </tr>
            `;
        });


        detailsHtml += `
                    </tbody>
                </table>
            </div>
        `;

        summaryContainer.innerHTML = detailsHtml;
    }

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html';
            return;
        }

        const { data: profile } = await supabase.from('profiles').select('full_name').eq('id', user.id).single();
        document.getElementById('user-display').textContent = `Welcome, ${profile?.full_name || user.email}`;
    }

    document.getElementById('new-quote-btn').addEventListener('click', () => {
        // Clear the session storage so this page can't be reloaded with old data
        sessionStorage.removeItem('currentQuoteSummary');
        window.location.href = './calculator.html';
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
        sessionStorage.removeItem('currentQuoteSummary');
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });

    // Initialize page
    checkUser();
    displaySummary();

</script>
</body>
</html>
