<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Contacts Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Select2 for advanced search dropdowns -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --pearl-light-green: #e6f2e9;
            --light-gray: #f8f9fa;
            --border-gray: #e2e8f0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--pearl-green);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #cbd5e0;
        }
        .calculator-toggle {
            display: flex;
            border: 1px solid var(--pearl-green);
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .calculator-toggle button {
            padding: 0.5rem 1rem;
            border: none;
            background-color: white;
            color: var(--pearl-green);
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .calculator-toggle button.active {
            background-color: var(--pearl-green);
            color: white;
            cursor: default;
        }
        .calculator-toggle button:not(.active):hover {
            background-color: var(--pearl-light-green);
        }

        /* Custom styles for Select2 */
        .select2-container--default .select2-selection--single {
            height: 2.5rem; /* 40px */
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 2.5rem;
            padding-left: 0.75rem;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 2.5rem;
        }
        .select2-dropdown {
            border-radius: 0.375rem;
            border: 1px solid #d1d5db;
        }

        /* Wearer Type Toggle */
        .wearer-toggle-label {
            border: 1px solid var(--border-gray);
            background-color: white;
            color: #4a5568;
            transition: background-color 0.2s, color 0.2s;
        }
        input[type="radio"]:checked + .wearer-toggle-label {
            background-color: var(--pearl-green);
            color: white;
            border-color: var(--pearl-green);
        }
        
        /* Results Table */
        .results-table th, .results-table td {
            padding: 0.75rem 1rem;
            text-align: right;
            vertical-align: middle;
        }
        .results-table th:first-child {
            text-align: left;
            font-weight: 500;
            color: #4a5568;
        }
        .results-table .highlight {
            font-weight: 700;
            color: var(--pearl-dark-green);
        }
        .results-table .savings {
            color: var(--pearl-green);
        }
        .results-table thead th {
            text-align: center;
        }
        .results-table .annual-col {
            background-color: var(--pearl-light-green);
        }
        .results-table .final-total {
            font-size: 1.125rem; /* text-lg */
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- Header Bar -->
    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-10">
        <div>
            <img src="https://i.imgur.com/8nC06jU.png" alt="Pearle Vision Logo" class="h-8" onerror="this.onerror=null;this.src='https://placehold.co/150x40/ffffff/000000?text=Logo';">
        </div>
        
        <div class="calculator-toggle">
            <button onclick="window.location.href='./calculator.html'">Glasses</button>
            <button class="active" onclick="window.location.href='./contacts.html'">Contacts</button>
        </div>

        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto">
             <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">

                <!-- Left Column: Configuration Panel -->
                <div class="lg:col-span-2 space-y-6">
                    <div class="bg-white p-6 rounded-lg shadow h-full">
                        <h2 class="text-2xl font-bold text-gray-800 mb-4">Contact Lens Savings Plan</h2>
                        <div class="space-y-6">
                            <div>
                                <label for="contact-lens-select" class="block text-sm font-medium text-gray-700 mb-1">CL Brand & Type</label>
                                <select id="contact-lens-select" class="w-full">
                                    <option></option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Lens Type</label>
                                <p id="lens-type-display" class="mt-1 text-lg font-semibold text-gray-900 h-8 flex items-center">-</p>
                            </div>
                            <div>
                                <label for="vision-plan-benefit" class="block text-sm font-medium text-gray-700 mb-1">Vision Plan Benefit</label>
                                <input type="text" inputmode="decimal" id="vision-plan-benefit" placeholder="$0.00" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500 dollar-format">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Wearer Type</label>
                                <div class="flex rounded-md shadow-sm">
                                    <input type="radio" name="wearer-type" id="wearer-new" value="new" class="hidden" checked>
                                    <label for="wearer-new" class="wearer-toggle-label rounded-l-md px-4 py-2 cursor-pointer w-full text-center">New Wearer</label>

                                    <input type="radio" name="wearer-type" id="wearer-current" value="current" class="hidden">
                                    <label for="wearer-current" class="wearer-toggle-label rounded-r-md px-4 py-2 cursor-pointer w-full text-center">Current Wearer</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Quote Summary -->
                <div class="lg:col-span-3">
                    <div class="bg-white p-6 rounded-lg shadow h-full">
                        <div id="summary-container" class="opacity-25 transition-opacity duration-300">
                             <table class="w-full results-table text-sm">
                                <thead>
                                    <tr class="border-b">
                                        <th></th>
                                        <th class="font-semibold">3 MONTH</th>
                                        <th class="font-semibold">6 MONTH</th>
                                        <th class="font-bold text-green-700 annual-col rounded-t-lg">ANNUAL</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr class="border-b"><th scope="row">No. of Boxes</th><td id="boxes-3m">0</td><td id="boxes-6m">0</td><td id="boxes-annual" class="annual-col">0</td></tr>
                                    <tr class="border-b"><th scope="row">Price / Box</th><td colspan="3" id="price-per-box" class="text-center font-semibold text-gray-700"></td></tr>
                                    <tr class="border-b"><th scope="row">Total Cost</th><td id="total-3m">$0.00</td><td id="total-6m">$0.00</td><td id="total-annual" class="annual-col">$0.00</td></tr>
                                    <tr class="border-b"><th scope="row" class="savings">Mfr. Mail in Rebate</th><td id="rebate-3m" class="savings">-$0.00</td><td id="rebate-6m" class="savings">-$0.00</td><td id="rebate-annual" class="annual-col savings">-$0.00</td></tr>
                                    <tr class="border-b"><th scope="row" class="savings">Store Discount (5%)</th><td id="discount-3m" class="savings">-$0.00</td><td id="discount-6m" class="savings">-$0.00</td><td id="discount-annual" class="annual-col savings">-$0.00</td></tr>
                                     <tr class="border-b"><th scope="row">Sales Tax (6%)</th><td id="tax-3m">$0.00</td><td id="tax-6m">$0.00</td><td id="tax-annual" class="annual-col">$0.00</td></tr>
                                     <tr class="border-b"><th scope="row" class="highlight">Cost / Box</th><td id="cost-per-box-3m" class="highlight">$0.00</td><td id="cost-per-box-6m" class="highlight">$0.00</td><td id="cost-per-box-annual" class="annual-col highlight">$0.00</td></tr>
                                     <tr><th scope="row" class="highlight pt-4">Today's Total</th><td id="final-3m" class="highlight final-total pt-4">$0.00</td><td id="final-6m" class="highlight final-total pt-4">$0.00</td><td id="final-annual" class="highlight final-total annual-col rounded-b-lg pt-4 text-xl">$0.00</td></tr>
                                </tbody>
                             </table>
                         </div>
                    </div>
                </div>
             </div>
             
             <!-- Page Actions -->
             <div class="mt-8 pt-6 border-t border-gray-200 flex justify-center">
                <div class="flex space-x-4 w-full md:w-2/3 lg:w-1/2">
                    <button id="reset-button" class="btn btn-secondary w-full py-3 text-base">Reset</button>
                    <button id="save-quote-button" class="btn btn-primary w-full py-3 text-base">Save Quote</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Error Modal (reused from calculator.html structure) -->
    <div id="error-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-2">Data Error</h3>
                <div class="mt-2 px-7 py-3">
                    <p id="error-modal-message" class="text-sm text-gray-500"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="close-error-modal-btn" class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-300">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script type="module">
    import { supabase } from './supabase-client.js';

    // This will be populated from Supabase
    let contactLensDatabase = [];
    let select2Data = [];
    
    // Constants for calculations
    const STORE_DISCOUNT_PERCENTAGE = 0.05; // Fixed 5% store discount
    const TAX_RATE = 0.06; // Fixed 6% sales tax

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    
    function getCleanNumber(selector) {
        const value = $(selector).val();
        if (typeof value === 'string') {
            return parseFloat(value.replace(/[^0-9.]/g, '')) || 0;
        }
        return value || 0;
    }

    function showErrorModal(message) {
        const modal = document.getElementById('error-modal');
        const modalMessage = document.getElementById('error-modal-message');
        modalMessage.textContent = message;
        modal.classList.remove('hidden');
    }

    function calculate() {
        const selectedLensId = $('#contact-lens-select').val();
        const summaryContainer = $('#summary-container');
        
        if (!selectedLensId) {
            summaryContainer.addClass('opacity-25');
            resetSummary();
            return;
        }
        summaryContainer.removeClass('opacity-25');

        const lens = contactLensDatabase.find(l => l.id == selectedLensId);
        if (!lens) {
            resetSummary();
            return;
        }

        const wearerType = $('input[name="wearer-type"]:checked').val();
        const visionBenefit = getCleanNumber('#vision-plan-benefit');

        // Update basic lens info display
        $('#price-per-box').text(formatCurrency(lens.price_per_box));
        $('#lens-type-display').text(lens.type || 'N/A');

        // Use box counts directly from fetched data
        const boxes_3m = lens.number_of_contacts_three_months;
        const boxes_6m = lens.number_of_contacts_six_months;
        const boxes_annual = lens.number_of_contacts_one_year;
        
        $('#boxes-3m').text(boxes_3m);
        $('#boxes-6m').text(boxes_6m);
        $('#boxes-annual').text(boxes_annual);

        // --- Calculate for 3 Months ---
        const total3m = lens.price_per_box * boxes_3m;
        const rebate3m = lens.new_wearer_rebate_three || 0; 
        const discount3m = 0; // No store discount for 3-month
        
        // Calculate amount subject to tax *before* any store discount
        let taxableAmount3m = total3m - visionBenefit - rebate3m;
        taxableAmount3m = Math.max(0, taxableAmount3m); // Ensure non-negative taxable amount
        
        const tax3m = taxableAmount3m * TAX_RATE; // Tax based on pre-discount amount

        // Calculate subtotal after all deductions including discount
        let subtotal3m = total3m - visionBenefit - rebate3m - discount3m;
        subtotal3m = Math.max(0, subtotal3m); // Ensure subtotal doesn't go below zero
        
        const final3m = subtotal3m + tax3m;
        const costPerBox3m = boxes_3m > 0 ? final3m / boxes_3m : 0; // Re-added this line

        $('#total-3m').text(formatCurrency(total3m));
        $('#rebate-3m').text(`-${formatCurrency(rebate3m)}`);
        $('#discount-3m').text(`-${formatCurrency(discount3m)}`); // This will now show -$0.00
        $('#tax-3m').text(formatCurrency(tax3m));
        $('#cost-per-box-3m').text(formatCurrency(costPerBox3m));
        $('#final-3m').text(formatCurrency(final3m));

        // --- Calculate for 6 Months ---
        const total6m = lens.price_per_box * boxes_6m;
        const rebate6m = lens.new_wearer_rebate_six || 0; 
        const discount6m = 0; // No store discount for 6-month

        // Calculate amount subject to tax *before* any store discount
        let taxableAmount6m = total6m - visionBenefit - rebate6m;
        taxableAmount6m = Math.max(0, taxableAmount6m); // Ensure non-negative taxable amount

        const tax6m = taxableAmount6m * TAX_RATE; // Tax based on pre-discount amount

        // Calculate subtotal after all deductions including discount
        let subtotal6m = total6m - visionBenefit - rebate6m - discount6m;
        subtotal6m = Math.max(0, subtotal6m); // Ensure subtotal doesn't go below zero

        const final6m = subtotal6m + tax6m;
        const costPerBox6m = boxes_6m > 0 ? final6m / boxes_6m : 0; // Re-added this line

        $('#total-6m').text(formatCurrency(total6m));
        $('#rebate-6m').text(`-${formatCurrency(rebate6m)}`); // Fixed typo: changed reb6m to rebate6m
        $('#discount-6m').text(`-${formatCurrency(discount6m)}`); // This will now show -$0.00
        $('#tax-6m').text(formatCurrency(tax6m));
        $('#cost-per-box-6m').text(formatCurrency(costPerBox6m));
        $('#final-6m').text(formatCurrency(final6m));
        
        // --- Calculate for Annual ---
        const totalAnnual = lens.price_per_box * boxes_annual;
        const rebateAnnual = wearerType === 'current' ? (lens.old_wearer_rebate_annual || 0) : (lens.new_wearer_rebate_annual || 0);
        
        // Calculate amount subject to tax *before* store discount
        let taxableAmountAnnual = totalAnnual - visionBenefit - rebateAnnual;
        taxableAmountAnnual = Math.max(0, taxableAmountAnnual); // Ensure non-negative taxable amount

        const taxAnnual = taxableAmountAnnual * TAX_RATE; // Tax based on pre-discount amount
        
        // Calculate discount based on total after vision benefit and manufacturer rebate
        const discountAnnual = taxableAmountAnnual > 0 ? taxableAmountAnnual * STORE_DISCOUNT_PERCENTAGE : 0;
        
        // Calculate subtotal after all deductions including discount
        let subtotalAnnual = totalAnnual - visionBenefit - rebateAnnual - discountAnnual;
        subtotalAnnual = Math.max(0, subtotalAnnual); // Ensure subtotal doesn't go below zero

        const finalAnnual = subtotalAnnual + taxAnnual;
        const costPerBoxAnnual = boxes_annual > 0 ? finalAnnual / boxes_annual : 0; // Re-added this line

        $('#total-annual').text(formatCurrency(totalAnnual));
        $('#rebate-annual').text(`-${formatCurrency(rebateAnnual)}`);
        $('#discount-annual').text(`-${formatCurrency(discountAnnual)}`);
        $('#tax-annual').text(formatCurrency(taxAnnual));
        $('#cost-per-box-annual').text(formatCurrency(costPerBoxAnnual));
        $('#final-annual').text(formatCurrency(finalAnnual));
    }

    function resetSummary() {
        $('#price-per-box').text('');
        $('#lens-type-display').text('-'); // Reset lens type display
        ['3m', '6m', 'annual'].forEach(d => {
            $(`#boxes-${d}`).text('0');
            $(`#total-${d}`).text('$0.00');
            $(`#rebate-${d}`).text('-$0.00');
            $(`#discount-${d}`).text('-$0.00');
            $(`#tax-${d}`).text('$0.00');
            $(`#cost-per-box-${d}`).text('$0.00');
            $(`#final-${d}`).text('$0.00');
        });
    }
    
    function resetCalculator() {
        $('#contact-lens-select').val(null).trigger('change');
        $('#vision-plan-benefit').val('');
        $('#wearer-new').prop('checked', true);
        calculate();
    }

    async function fetchData() {
        const { data, error } = await supabase
            .from('contacts') // Table name: 'contacts'
            .select('id, contact_name, price, number_of_contacts_three_months, number_of_contacts_six_months, number_of_contacts_one_year, new_wearer_rebate_three, new_wearer_rebate_six, new_wearer_rebate_annual, old_wearer_rebate_annual, contact_type');

        if (error) {
            console.error("Error fetching contact lens data:", error);
            showErrorModal("Could not load contact lens data. Please contact support. Error: " + error.message);
            return;
        }
        
        // Map fetched data to the expected structure
        contactLensDatabase = data.map(item => ({
            id: item.id, // Assuming 'id' is present in your Supabase table
            name: item.contact_name,
            price_per_box: item.price,
            number_of_contacts_three_months: item.number_of_contacts_three_months,
            number_of_contacts_six_months: item.number_of_contacts_six_months,
            number_of_contacts_one_year: item.number_of_contacts_one_year,
            new_wearer_rebate_three: item.new_wearer_rebate_three,
            new_wearer_rebate_six: item.new_wearer_rebate_six,
            new_wearer_rebate_annual: item.new_wearer_rebate_annual,
            old_wearer_rebate_annual: item.old_wearer_rebate_annual,
            type: item.contact_type,
        }));

        // Prepare data for Select2
        select2Data = contactLensDatabase.map(lens => ({ id: lens.id, text: lens.name }));
        
        // Initialize Select2 dropdown
        $('#contact-lens-select').select2({
            placeholder: 'Type to search for a lens...',
            data: select2Data,
            allowClear: true // Allows clearing the selection
        });

        // Trigger initial calculation after data is loaded and Select2 is initialized
        calculate();
    }

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html'; // Redirect to login if not authenticated
            return;
        }
        document.getElementById('user-display').textContent = `Welcome, ${user.email}`;
        // Fetch pricing data only after user is confirmed authenticated
        fetchData(); 
    }

    function onFocusCurrency(event) {
        const value = event.target.value;
        if (value) {
            event.target.value = value.replace(/[^0-9.]/g, '');
        }
    }

    function onBlurCurrency(event) {
        const value = parseFloat(event.target.value);
        if (!isNaN(value)) {
            event.target.value = formatCurrency(value);
        } else {
            event.target.value = '';
        }
    }


    $(document).ready(function() {
        checkUser(); // This now initiates fetchData() after auth check
        
        $('#logout-btn').on('click', async () => {
            await supabase.auth.signOut();
            window.location.href = './index.html';
        });

        $('#reset-button').on('click', resetCalculator);
        $('#close-error-modal-btn').on('click', () => {
             document.getElementById('error-modal').classList.add('hidden');
        });

        // Event listeners for calculation triggers
        $('#contact-lens-select').on('change', calculate); // Use 'change' for select2
        $('#vision-plan-benefit').on('input', calculate);
        $('input[name="wearer-type"]').on('change', calculate);

        // Event listeners for currency formatting
        $('#vision-plan-benefit').on('focus', onFocusCurrency);
        $('#vision-plan-benefit').on('blur', onBlurCurrency);
        
        // Apply initial formatting if there's a default value
        $('#vision-plan-benefit').trigger('blur');
    });
</script>
</body>
</html>
