<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Owner Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f8f9fa;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .btn-primary {
            background-color: var(--pearl-green);
            transition: background-color 0.3s;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #cbd5e0;
        }
        .btn-danger {
            background-color: #dc2626; color: white;
            transition: background-color 0.3s;
        }
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        .btn-danger:disabled {
            background-color: #fca5a5;
            cursor: not-allowed;
        }
        .card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .modal-overlay {
            background-color: rgba(0,0,0,0.5);
        }
        /* Accordion Styles */
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out;
        }
        .accordion-button svg {
            transition: transform 0.3s ease-in-out;
        }
        .accordion-button.open svg {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" alt="Pearle Vision Logo" class="h-8" onerror="this.onerror=null;this.src='https://placehold.co/150x40/ffffff/000000?text=Logo';">
        </div>
        <nav class="flex items-center space-x-4">
            <a href="./dashboard.html" class="text-sm font-medium text-gray-600 hover:text-pearl-green">Dashboard</a>
            <a href="./admin.html" class="text-sm font-bold text-pearl-green border-b-2 border-pearl-green">Management</a>
        </nav>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-8">
            <div id="user-management" class="card">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">User Management</h2>
                    <button id="add-new-user-btn" class="btn-primary text-white font-bold py-2 px-4 rounded">+ Add User</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Name</th><th class="p-2">Email</th><th class="p-2">Role</th><th class="p-2 text-center">Actions</th></tr></thead><tbody id="users-table-body"></tbody></table>
                </div>
            </div>
            
            <div id="component-management" class="card">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Component & Pricing Management</h2>
                    <button id="add-new-btn" class="btn-primary text-white font-bold py-2 px-4 rounded">+ Add New Item</button>
                </div>
                <div id="components-accordion-container" class="space-y-2">
                    <!-- Accordion items will be dynamically inserted here -->
                </div>
            </div>

        </div>
    </main>
    
    <!-- Modals -->
    <div id="item-modal" class="fixed inset-0 z-30 hidden items-center justify-center modal-overlay"><div class="card w-full max-w-md"><h3 id="modal-title" class="text-xl font-bold mb-4">Add New Item</h3><form id="item-form" class="space-y-4"><input type="hidden" id="item-id"><div><label for="item-name" class="block text-sm font-medium text-gray-700">Item Name</label><input type="text" id="item-name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required></div><div><label for="item-category" class="block text-sm font-medium text-gray-700">Category</label><input type="text" id="item-category" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required></div><div><label for="item-price" class="block text-sm font-medium text-gray-700">Retail Price</label><input type="number" step="0.01" id="item-price" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required></div><div class="flex justify-end space-x-2 pt-4"><button type="button" id="cancel-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button><button type="submit" class="btn-primary text-white font-bold py-2 px-4 rounded">Save</button></div></form></div></div>
    <div id="user-modal" class="fixed inset-0 z-30 hidden items-center justify-center modal-overlay"><div class="card w-full max-w-md"><h3 class="text-xl font-bold mb-4">Add New User</h3><form id="user-form" class="space-y-4"><div><label for="user-full-name" class="block text-sm font-medium text-gray-700">Full Name</label><input type="text" id="user-full-name" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required></div><div><label for="user-email" class="block text-sm font-medium text-gray-700">Email</label><input type="email" id="user-email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required></div><div><label for="user-password" class="block text-sm font-medium text-gray-700">Password</label><input type="password" id="user-password" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required></div><div><label for="user-role" class="block text-sm font-medium text-gray-700">Role</label><select id="user-role" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" required><option value="optician">Optician</option><option value="owner">Owner</option></select></div><div class="flex justify-end space-x-2 pt-4"><button type="button" id="cancel-user-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button><button type="submit" class="btn-primary text-white font-bold py-2 px-4 rounded">Create User</button></div></form></div></div>
    
    <div id="store-assignment-modal" class="fixed inset-0 z-30 hidden items-center justify-center modal-overlay">
        <div class="card w-full max-w-md">
            <h3 id="store-modal-title" class="text-xl font-bold mb-4">Manage Store Assignments</h3>
            <form id="store-assignment-form" class="space-y-4">
                <input type="hidden" id="assignment-optician-id">
                <div id="store-checkbox-container" class="space-y-2">
                    <!-- Checkboxes will be populated here -->
                </div>
                <div class="flex justify-end space-x-2 pt-4">
                    <button type="button" id="cancel-assignment-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit" class="btn-primary text-white font-bold py-2 px-4 rounded">Save Assignments</button>
                </div>
            </form>
        </div>
    </div>


<script type="module">
    import { supabase } from './supabase-client.js';

    let priceListData = [];
    let userData = [];
    let allStores = [];

    const usersTableBody = document.getElementById('users-table-body');
    const itemModal = document.getElementById('item-modal');
    const itemForm = document.getElementById('item-form');
    const addNewBtn = document.getElementById('add-new-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const userModal = document.getElementById('user-modal');
    const userForm = document.getElementById('user-form');
    const addUserBtn = document.getElementById('add-new-user-btn');
    const cancelUserBtn = document.getElementById('cancel-user-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const storeAssignmentModal = document.getElementById('store-assignment-modal');
    const storeAssignmentForm = document.getElementById('store-assignment-form');
    const cancelAssignmentBtn = document.getElementById('cancel-assignment-btn');
    const storeCheckboxContainer = document.getElementById('store-checkbox-container');
    const componentsAccordionContainer = document.getElementById('components-accordion-container');

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    
    const renderComponentsAccordion = () => {
        componentsAccordionContainer.innerHTML = '';
        const groupedByCategory = priceListData.reduce((acc, item) => {
            (acc[item.Category] = acc[item.Category] || []).push(item);
            return acc;
        }, {});

        Object.keys(groupedByCategory).sort().forEach(category => {
            const accordionItem = document.createElement('div');
            accordionItem.className = 'border border-gray-200 rounded-md';
            
            const items = groupedByCategory[category];
            const tableRows = items.map(item => `
                <tr class="border-b hover:bg-gray-50 last:border-b-0">
                    <td class="p-2">${item.Item}</td>
                    <td class="p-2">${formatCurrency(item.Retail)}</td>
                    <td class="p-2 text-center">
                        <input type="checkbox" data-id="${item.id}" class="active-toggle h-4 w-4 text-green-600 border-gray-300 rounded" ${item.is_active ? 'checked' : ''}>
                    </td>
                    <td class="p-2 text-center">
                        <button data-id="${item.id}" class="edit-btn text-sm text-blue-600 hover:underline">Edit</button>
                    </td>
                </tr>
            `).join('');

            accordionItem.innerHTML = `
                <button class="accordion-button w-full flex justify-between items-center p-4 bg-gray-50 hover:bg-gray-100 focus:outline-none">
                    <span class="font-bold text-lg text-gray-700">${category}</span>
                    <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div class="accordion-content bg-white p-2">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="p-2">Item</th>
                                <th class="p-2">Retail Price</th>
                                <th class="p-2 text-center">Active</th>
                                <th class="p-2 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableRows}
                        </tbody>
                    </table>
                </div>
            `;
            componentsAccordionContainer.appendChild(accordionItem);
        });
    };

    const renderUsersTable = () => {
        usersTableBody.innerHTML = '';
        userData.forEach(user => {
            const row = document.createElement('tr');
            row.className = 'border-b hover:bg-gray-50';
            row.innerHTML = `
                <td class="p-2">${user.full_name || 'N/A'}</td>
                <td class="p-2">${user.email}</td>
                <td class="p-2">${user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : 'N/A'}</td>
                <td class="p-2 text-center space-x-2">
                    <button data-id="${user.id}" class="manage-stores-btn text-sm bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700">Manage Stores</button>
                    <button data-id="${user.id}" class="remove-user-btn text-sm btn-danger px-2 py-1 rounded">Remove</button>
                </td>
            `;
            usersTableBody.appendChild(row);
        });
    };

    const openItemModal = (item = null) => {
        itemForm.reset();
        if (item) {
            itemModal.querySelector('#modal-title').textContent = 'Edit Item';
            itemModal.querySelector('#item-id').value = item.id;
            itemModal.querySelector('#item-name').value = item.Item;
            itemModal.querySelector('#item-category').value = item.Category;
            itemModal.querySelector('#item-price').value = item.Retail;
        } else {
            itemModal.querySelector('#modal-title').textContent = 'Add New Item';
            itemModal.querySelector('#item-id').value = '';
        }
        itemModal.classList.remove('hidden'); itemModal.classList.add('flex');
    };
    const closeItemModal = () => itemModal.classList.add('hidden');
    
    const openUserModal = () => {
        userForm.reset();
        userModal.classList.remove('hidden'); userModal.classList.add('flex');
    };
    const closeUserModal = () => userModal.classList.add('hidden');

    const openStoreAssignmentModal = async (userId) => {
        const user = userData.find(u => u.id === userId);
        if (!user) return;

        document.getElementById('store-modal-title').textContent = `Manage Assignments for ${user.full_name}`;
        document.getElementById('assignment-optician-id').value = userId;

        const { data: assignments, error } = await supabase
            .from('store_assignments')
            .select('store_id')
            .eq('optician_id', userId);
        
        if (error) {
            console.error("Error fetching assignments", error);
            return;
        }
        const assignedStoreIds = assignments.map(a => a.store_id);

        storeCheckboxContainer.innerHTML = '';
        allStores.forEach(store => {
            const isChecked = assignedStoreIds.includes(store.id);
            storeCheckboxContainer.innerHTML += `
                <label class="flex items-center">
                    <input type="checkbox" value="${store.id}" class="h-4 w-4 text-pearl-green border-gray-300 rounded" ${isChecked ? 'checked' : ''}>
                    <span class="ml-2 text-gray-700">${store.name}</span>
                </label>
            `;
        });

        storeAssignmentModal.classList.remove('hidden');
        storeAssignmentModal.classList.add('flex');
    };
    const closeStoreAssignmentModal = () => storeAssignmentModal.classList.add('hidden');
    
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html';
            return;
        }
        
        const { data: profile, error } = await supabase
            .from('profiles')
            .select('role, full_name')
            .eq('id', user.id)
            .single();

        if (error || !profile || profile.role !== 'owner') {
            console.warn('Access Denied. User is not an owner or profile not found.');
            window.location.href = './calculator.html';
            return;
        }
        
        document.getElementById('user-display').textContent = `Welcome, ${profile.full_name || user.email}`;
    }

    async function fetchData() {
        const componentsPromise = supabase.from('components').select('*');
        const usersPromise = supabase.functions.invoke('get-all-users');
        const storesPromise = supabase.from('stores').select('*');

        const [componentsResult, usersResult, storesResult] = await Promise.all([componentsPromise, usersPromise, storesPromise]);

        if (componentsResult.error) console.error("Error fetching components:", componentsResult.error);
        else priceListData = componentsResult.data;

        if (usersResult.error) console.error("Error fetching users:", usersResult.error);
        else userData = usersResult.data;

        if (storesResult.error) console.error("Error fetching stores:", storesResult.error);
        else allStores = storesResult.data;

        renderComponentsAccordion();
        renderUsersTable();
    }
    
    // --- EVENT LISTENERS & INITIALIZATION ---
    (async () => {
        await checkUser();
        await fetchData();
    })();

    addNewBtn.addEventListener('click', () => openItemModal());
    cancelBtn.addEventListener('click', closeItemModal);
    itemModal.addEventListener('click', (e) => { if (e.target === itemModal) closeItemModal(); });
    
    addUserBtn.addEventListener('click', openUserModal);
    cancelUserBtn.addEventListener('click', closeUserModal);
    userModal.addEventListener('click', (e) => { if (e.target === userModal) closeUserModal(); });

    cancelAssignmentBtn.addEventListener('click', closeStoreAssignmentModal);
    storeAssignmentModal.addEventListener('click', (e) => { if (e.target === storeAssignmentModal) closeStoreAssignmentModal(); });

    logoutBtn.addEventListener('click', async () => { 
        await supabase.auth.signOut();
        window.location.href = './index.html'; 
    });

    itemForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitButton = itemForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Saving...';

        const id = document.getElementById('item-id').value;
        const itemData = {
            Item: document.getElementById('item-name').value,
            Category: document.getElementById('item-category').value,
            Retail: parseFloat(document.getElementById('item-price').value),
        };
        
        let error;
        if (id) {
            const { error: updateError } = await supabase.functions.invoke('update-component', {
                body: { id: id, itemData: itemData }
            });
            error = updateError;
        } else {
            const { error: createError } = await supabase.functions.invoke('create-component', {
                body: { itemData: itemData }
            });
            error = createError;
        }

        submitButton.disabled = false;
        submitButton.textContent = 'Save';

        if (error) {
            alert(`Error saving item: ${error.message}`);
        } else {
            alert('Item saved successfully!');
            await fetchData();
            closeItemModal();
        }
    });

    userForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitButton = userForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Creating...';

        const { error } = await supabase.functions.invoke('create-user', {
            body: {
                email: document.getElementById('user-email').value,
                password: document.getElementById('user-password').value,
                full_name: document.getElementById('user-full-name').value,
                role: document.getElementById('user-role').value
            }
        });

        submitButton.disabled = false;
        submitButton.textContent = 'Create User';

        if (error) {
            alert(`Error creating user: ${error.message}`);
        } else {
            alert('User created successfully!');
            await fetchData();
            closeUserModal();
        }
    });

    storeAssignmentForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitButton = storeAssignmentForm.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Saving...';

        const optician_id = document.getElementById('assignment-optician-id').value;
        const selectedStoreIds = Array.from(storeCheckboxContainer.querySelectorAll('input:checked')).map(input => input.value);

        const { error } = await supabase.functions.invoke('update-store-assignments', {
            body: {
                optician_id: optician_id,
                store_ids: selectedStoreIds
            }
        });
        
        submitButton.disabled = false;
        submitButton.textContent = 'Save Assignments';

        if (error) {
            alert(`Error updating assignments: ${error.message}`);
        } else {
            alert('Assignments updated successfully!');
            closeStoreAssignmentModal();
        }
    });

    componentsAccordionContainer.addEventListener('click', async (e) => {
        const button = e.target.closest('.accordion-button');
        if (button) {
            button.classList.toggle('open');
            const content = button.nextElementSibling;
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
            }
            return;
        }

        if (e.target.classList.contains('edit-btn')) {
            const id = e.target.dataset.id;
            const itemToEdit = priceListData.find(item => item.id == id);
            openItemModal(itemToEdit);
        }

        if (e.target.classList.contains('active-toggle')) {
            const checkbox = e.target;
            const id = checkbox.dataset.id;
            const is_active = checkbox.checked;

            checkbox.disabled = true;

            const { error } = await supabase.functions.invoke('update-component-status', {
                body: { id: Number(id), is_active: is_active }
            });

            if (error) {
                alert(`Error updating status: ${error.message}`);
                checkbox.checked = !is_active;
            } else {
                const itemInList = priceListData.find(item => item.id == id);
                if(itemInList) itemInList.is_active = is_active;
            }
            
            checkbox.disabled = false;
        }
    });
    
    usersTableBody.addEventListener('click', async (e) => {
        if (e.target.classList.contains('remove-user-btn')) {
            const id = e.target.dataset.id;
            const userEmail = userData.find(u => u.id === id)?.email || 'this user';
            
            if (confirm(`Are you sure you want to remove ${userEmail}? This action cannot be undone.`)) {
                e.target.disabled = true;
                e.target.textContent = 'Removing...';

                const { error } = await supabase.functions.invoke('delete-user', {
                    body: { userId: id }
                });

                if (error) {
                    alert(`Error deleting user: ${error.message}`);
                    e.target.disabled = false;
                    e.target.textContent = 'Remove';
                } else {
                    alert('User deleted successfully.');
                    await fetchData();
                }
            }
        }
        if (e.target.classList.contains('manage-stores-btn')) {
            const id = e.target.dataset.id;
            openStoreAssignmentModal(id);
        }
    });

</script>
</body>
</html>
