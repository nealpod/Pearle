<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f0f2f5;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .login-container {
            max-width: 400px;
            width: 90%;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: var(--pearl-green);
            transition: background-color 0.3s;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            font-weight: 700;
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        input[type="email"],
        input[type="password"] {
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            line-height: 1.25;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen bg-light-gray">

    <div class="login-container bg-white">
        <div class="text-center mb-8">
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" class="mx-auto mb-4" width="200" alt="Pearle Vision Logo">
            <h1 class="text-2xl font-bold text-gray-800">Store Portal Login</h1>
        </div>

        <form id="login-form">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                <input type="email" id="email" name="email" class="focus:outline-none focus:ring-2 focus:ring-pearl-green focus:border-transparent" required placeholder="you@example.com">
            </div>
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="focus:outline-none focus:ring-2 focus:ring-pearl-green focus:border-transparent mb-3" required placeholder="******************">
            </div>
            <div class="flex items-center justify-between">
                <button class="btn-primary" type="submit">
                    Sign In
                </button>
            </div>
        </form>
        
        <p id="status-message" class="text-center text-red-500 text-xs mt-4">&nbsp;</p>
    </div>

    <script type="module">
        import { supabase } from './supabase-client.js';

        const loginForm = document.getElementById('login-form');
        const statusMessage = document.getElementById('status-message');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            statusMessage.innerText = 'Signing in...';
            
            const email = loginForm.email.value;
            const password = loginForm.password.value;

            // Step 1: Authenticate the user
            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });

            if (authError) {
                statusMessage.innerText = authError.message;
                console.error('Authentication error:', authError);
                return;
            }

            // Step 2: Fetch the user's profile and role from the 'profiles' table
            if (authData.user) {
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role') // We only need the role for redirection
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) {
                    statusMessage.innerText = 'Could not retrieve user profile. Please contact an administrator.';
                    console.error('Profile fetch error:', profileError);
                    await supabase.auth.signOut(); 
                    return;
                }

                // Step 3: Redirect based on the role found in the profile
                if (profile) {
                    const userRole = profile.role;
                    console.log('Logged in user role:', userRole);

                    if (userRole === 'owner') {
                        window.location.href = './admin.html';
                    } else if (userRole === 'optician') {
                        // MODIFIED: Redirect to the new store selection page
                        window.location.href = './select-store.html';
                    } else {
                        statusMessage.innerText = 'Unknown user role. Access denied.';
                        await supabase.auth.signOut();
                    }
                } else {
                    statusMessage.innerText = 'No profile found for this user. Access denied.';
                    await supabase.auth.signOut();
                }
            } else {
                statusMessage.innerText = 'Authentication failed. Please try again.';
                console.error('Authentication failed: No user data returned.');
            }
        });
    </script>
</body>
</html>
