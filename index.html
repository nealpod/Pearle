<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f0f2f5;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .login-container {
            max-width: 400px;
            width: 90%;
            padding: 2rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-primary {
            background-color: var(--pearl-green);
            transition: background-color 0.3s;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            font-weight: 700;
            color: white;
            width: 100%;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        input[type="email"],
        input[type="password"] {
            border: 1px solid #e2e8f0;
            border-radius: 0.25rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            line-height: 1.25;
        }
        .modal-overlay {
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen bg-light-gray">

    <div class="login-container bg-white">
        <div class="text-center mb-8">
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" class="mx-auto mb-4" width="200" alt="Pearle Vision Logo" onerror="this.onerror=null;this.src='https://placehold.co/200x50/ffffff/000000?text=Logo';">
            <h1 class="text-2xl font-bold text-gray-800">Store Portal Login</h1>
        </div>

        <form id="login-form" method="POST" action="#">
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email Address</label>
                <input type="email" id="email" name="email" class="focus:outline-none focus:ring-2 focus:ring-pearl-green focus:border-transparent" required placeholder="you@example.com">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input type="password" id="password" name="password" class="focus:outline-none focus:ring-2 focus:ring-pearl-green focus:border-transparent" required placeholder="******************">
            </div>
            <div class="text-right mb-6">
                 <a href="#" id="forgot-password-link" class="text-sm text-pearl-green hover:text-pearl-dark-green font-semibold">Forgot Password?</a>
            </div>
            <div class="flex items-center justify-between">
                <button class="btn-primary" type="submit">
                    Sign In
                </button>
            </div>
        </form>
        
        <p id="status-message" class="text-center text-red-500 text-xs mt-4">&nbsp;</p>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-password-modal" class="fixed inset-0 z-30 hidden items-center justify-center modal-overlay">
        <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4">Reset Password</h3>
            <p id="modal-message" class="text-sm text-gray-600 mb-4">Enter your email address and we will send you a link to reset your password.</p>
            <form id="forgot-password-form">
                <div>
                    <label for="reset-email" class="block text-sm font-medium text-gray-700">Email Address</label>
                    <input type="email" id="reset-email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-pearl-green focus:border-pearl-green" required>
                </div>
                <div class="flex justify-end space-x-2 pt-6">
                    <button type="button" id="cancel-reset-btn" class="bg-gray-200 text-gray-800 font-bold py-2 px-4 rounded">Cancel</button>
                    <button type="submit" class="btn-primary text-white font-bold py-2 px-4 rounded" style="width: auto;">Send Reset Link</button>
                </div>
            </form>
        </div>
    </div>


    <script type="module">
        import { supabase } from './supabase-client.js';

        const loginForm = document.getElementById('login-form');
        const statusMessage = document.getElementById('status-message');
        const forgotPasswordModal = document.getElementById('forgot-password-modal');
        const forgotPasswordLink = document.getElementById('forgot-password-link');
        const forgotPasswordForm = document.getElementById('forgot-password-form');
        const cancelResetBtn = document.getElementById('cancel-reset-btn');
        const modalMessage = document.getElementById('modal-message');

        // --- Event Listener for Login Form ---
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const submitButton = loginForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            statusMessage.innerText = 'Signing in...';
            
            const email = loginForm.email.value;
            const password = loginForm.password.value;

            // Step 1: Authenticate the user
            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({ email, password });

            if (authError) {
                statusMessage.innerText = authError.message;
                submitButton.disabled = false;
                return;
            }

            // Step 2: Fetch the user's profile and role
            if (authData.user) {
                const { data: profile, error: profileError } = await supabase
                    .from('profiles')
                    .select('role')
                    .eq('id', authData.user.id)
                    .single();

                if (profileError) {
                    statusMessage.innerText = 'Could not retrieve user profile.';
                    await supabase.auth.signOut();
                    submitButton.disabled = false;
                    return;
                }

                // Step 3: Redirect based on role
                if (profile) {
                    const userRole = profile.role;
                    if (userRole === 'owner') {
                        window.location.href = './dashboard.html';
                    } else if (userRole === 'optician') {
                        window.location.href = './select-store.html';
                    } else {
                        statusMessage.innerText = 'Unknown user role. Access denied.';
                        await supabase.auth.signOut();
                        submitButton.disabled = false;
                    }
                } else {
                    statusMessage.innerText = 'No profile found for this user.';
                    await supabase.auth.signOut();
                    submitButton.disabled = false;
                }
            } else {
                statusMessage.innerText = 'Authentication failed. Please try again.';
                submitButton.disabled = false;
            }
        });

        // --- Event Listeners for Forgot Password Modal ---
        forgotPasswordLink.addEventListener('click', (e) => {
            e.preventDefault();
            modalMessage.textContent = 'Enter your email address and we will send you a link to reset your password.';
            modalMessage.classList.remove('text-green-600');
            modalMessage.classList.add('text-gray-600');
            forgotPasswordForm.reset();
            forgotPasswordModal.classList.remove('hidden');
            forgotPasswordModal.classList.add('flex');
        });

        cancelResetBtn.addEventListener('click', () => {
            forgotPasswordModal.classList.add('hidden');
            forgotPasswordModal.classList.remove('flex');
        });

        forgotPasswordModal.addEventListener('click', (e) => {
            if (e.target === forgotPasswordModal) {
                cancelResetBtn.click();
            }
        });
        
        // --- Event Listener for Password Reset Form ---
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const resetEmail = document.getElementById('reset-email').value;
            const submitButton = forgotPasswordForm.querySelector('button[type="submit"]');
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            const { error } = await supabase.auth.resetPasswordForEmail(resetEmail, {
                redirectTo: `${window.location.origin}/update-password.html`,
            });

            if (error) {
                modalMessage.textContent = `Error: ${error.message}`;
            } else {
                modalMessage.textContent = 'If an account exists for this email, a password reset link has been sent.';
                modalMessage.classList.remove('text-gray-600');
                modalMessage.classList.add('text-green-600');
            }
            
            submitButton.disabled = false;
            submitButton.textContent = 'Send Reset Link';
        });

    </script>
</body>
</html>
