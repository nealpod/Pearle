<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pearle Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f8f9fa;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .kpi-card {
            padding: 1rem;
        }
        .kpi-title {
            color: #6b7280; /* gray-500 */
        }
        .kpi-value {
            color: var(--pearl-dark-green);
        }
        /* Styles for the new summary */
        .summary-grid-item {
            border-right: 1px solid #e5e7eb; /* gray-200 */
        }
        .summary-grid-item:last-child {
            border-right: none;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" alt="Pearle Vision Logo" class="h-8">
        </div>
        <nav class="flex items-center space-x-4">
            <a href="./dashboard.html" class="text-sm font-bold text-pearl-green border-b-2 border-pearl-green">Dashboard</a>
            <a href="./admin.html" class="text-sm font-medium text-gray-600 hover:text-pearl-green">Management</a>
        </nav>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-8">
            <div class="card">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="date-range-filter" class="block text-sm font-medium text-gray-700">Date Range</label>
                        <select id="date-range-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-pearl-green focus:border-pearl-green sm:text-sm rounded-md">
                            <option value="7">Last 7 Days</option>
                            <option value="30" selected>Last 30 Days</option>
                            <option value="90">Last 90 Days</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <div>
                        <label for="store-filter" class="block text-sm font-medium text-gray-700">Store</label>
                        <select id="store-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-pearl-green focus:border-pearl-green sm:text-sm rounded-md">
                            <option value="all">All Stores</option>
                            </select>
                    </div>
                </div>
            </div>

            <div id="custom-summary" class="card">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 text-center">
                    <div class="summary-grid-item p-4">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Total Sales</h3>
                        <p id="summary-total-sales" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                    </div>
                    <div class="summary-grid-item p-4">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Exams Sold</h3>
                        <p id="summary-exam-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-exam-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                    <div class="summary-grid-item p-4">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Frames Sold</h3>
                        <p id="summary-frame-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-frame-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                    <div class="summary-grid-item p-4">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Contact Sales</h3>
                        <p id="summary-contact-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-contact-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="card kpi-card"><h3 class="kpi-title">Total # of Sales</h3><p id="kpi-num-sales" class="text-3xl font-bold kpi-value">0</p></div>
                <div class="card kpi-card"><h3 class="kpi-title">Average Sale Value</h3><p id="kpi-avg-sale" class="text-3xl font-bold kpi-value">$0.00</p></div>
                <div class="card kpi-card"><h3 class="kpi-title">Insurance Savings</h3><p id="kpi-ins-savings" class="text-3xl font-bold kpi-value">$0.00</p></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card"><canvas id="sales-over-time-chart"></canvas></div>
                <div class="card"><canvas id="sales-by-category-chart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card">
                    <h3 class="text-xl font-bold mb-4">Optician Leaderboard</h3>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Name</th><th class="p-2">Store</th><th class="p-2 text-right">Total Sales</th><th class="p-2 text-right"># of Sales</th></tr></thead><tbody id="optician-leaderboard-body"></tbody></table></div>
                </div>
                <div class="card">
                    <h3 class="text-xl font-bold mb-4">Recent Sales</h3>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Customer</th><th class="p-2">Optician</th><th class="p-2 text-right">Amount</th></tr></thead><tbody id="recent-sales-body"></tbody></table></div>
                </div>
            </div>
        </div>
    </main>

<script type="module">
    import { supabase } from './supabase-client.js';

    // Global variables to hold data
    let allSales = [];
    let allProfiles = [];
    let allStores = [];
    let salesChart, categoryChart;

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html';
            return;
        }
        
        const { data: profile, error } = await supabase.from('profiles').select('role, full_name').eq('id', user.id).single();

        if (error || !profile || profile.role !== 'owner') {
            console.warn('Access Denied. User is not an owner or profile not found.');
            window.location.href = './calculator.html';
            return;
        }
        
        document.getElementById('user-display').textContent = `Welcome, ${profile.full_name || user.email}`;
        
        await fetchData();
    }

    async function fetchData() {
        const salesPromise = supabase.from('sales').select('*').order('created_at', { ascending: false });
        const profilesPromise = supabase.from('profiles').select('id, full_name');
        const storesPromise = supabase.from('stores').select('*');

        const [salesResult, profilesResult, storesResult] = await Promise.all([salesPromise, profilesPromise, storesPromise]);

        if (salesResult.error || profilesResult.error || storesResult.error) {
            console.error("Error fetching dashboard data:", salesResult.error || profilesResult.error || storesResult.error);
            alert("Could not load dashboard data.");
            return;
        }
        
        allSales = salesResult.data;
        allProfiles = profilesResult.data;
        allStores = storesResult.data;

        populateStoreFilter();
        updateDashboard();
    }

    function populateStoreFilter() {
        const storeFilter = document.getElementById('store-filter');
        allStores.forEach(store => {
            const option = document.createElement('option');
            option.value = store.id;
            option.textContent = store.name;
            storeFilter.appendChild(option);
        });
    }

    function updateDashboard() {
        const dateFilter = document.getElementById('date-range-filter').value;
        const storeFilter = document.getElementById('store-filter').value;

        // --- Filter Data ---
        const now = new Date();
        const filteredSales = allSales.filter(sale => {
            const saleDate = new Date(sale.created_at);
            let dateCondition = true;
            if (dateFilter !== 'all') {
                const days = parseInt(dateFilter);
                const pastDate = new Date();
                pastDate.setDate(now.getDate() - days);
                dateCondition = saleDate >= pastDate;
            }
            const storeCondition = storeFilter === 'all' || sale.store_id.toString() === storeFilter;
            return dateCondition && storeCondition;
        });

        // --- Render Components ---
        renderCustomSummary(filteredSales); // NEW function call
        renderKPIs(filteredSales);
        renderSalesChart(filteredSales);
        renderCategoryChart(filteredSales);
        renderOpticianLeaderboard(filteredSales);
        renderRecentSales(filteredSales);
    }

    // NEW: Function to render the custom summary
    function renderCustomSummary(sales) {
        let totalSalesValue = 0;
        let examCount = 0;
        let examValue = 0;
        let frameCount = 0;
        let frameValue = 0;
        let contactCount = 0;
        let contactValue = 0;

        sales.forEach(sale => {
            totalSalesValue += sale.final_cost || 0;
            const details = sale.quote_details;

            if (details) {
                // Tally exams. Note: Exam value is only available from glasses sales due to current app logic.
                if (details.exams && details.exams.length > 0) {
                    examCount += details.exams.length;
                    examValue += details.exams.reduce((sum, item) => sum + (item.price || 0), 0);
                }

                // Check sale type
                if (details.type === 'Contacts') {
                    contactCount++;
                    // The value of the contact sale transaction
                    contactValue += sale.final_cost || 0;
                } else { // Assumes a glasses sale
                    let currentFrameValue = 0;
                    if (details.frame && details.frame.price > 0) {
                        frameCount++;
                        currentFrameValue += details.frame.finalCost || 0;
                    }
                    if (details.lenses) {
                        currentFrameValue += Object.values(details.lenses).reduce((sum, item) => sum + item.price, 0);
                    }
                    if (details.addOns && details.addOns.length > 0) {
                        currentFrameValue += details.addOns.reduce((sum, item) => sum + item.price, 0);
                    }
                    frameValue += currentFrameValue;
                }
            }
        });

        document.getElementById('summary-total-sales').textContent = formatCurrency(totalSalesValue);
        document.getElementById('summary-exam-value').textContent = formatCurrency(examValue);
        document.getElementById('summary-exam-count').textContent = `${examCount} units`;
        document.getElementById('summary-frame-value').textContent = formatCurrency(frameValue);
        document.getElementById('summary-frame-count').textContent = `${frameCount} units`;
        document.getElementById('summary-contact-value').textContent = formatCurrency(contactValue);
        document.getElementById('summary-contact-count').textContent = `${contactCount} units`;
    }
    
    function renderKPIs(sales) {
        const totalSales = sales.reduce((sum, sale) => sum + (sale.final_cost || 0), 0);
        const numSales = sales.length;
        const avgSale = numSales > 0 ? totalSales / numSales : 0;
        const insSavings = sales.reduce((sum, sale) => sum + (sale.insurance_savings || 0), 0);

        // This KPI is now in the main summary, so we can remove it or keep it for consistency
        // document.getElementById('kpi-total-sales').textContent = formatCurrency(totalSales);
        document.getElementById('kpi-num-sales').textContent = numSales;
        document.getElementById('kpi-avg-sale').textContent = formatCurrency(avgSale);
        document.getElementById('kpi-ins-savings').textContent = formatCurrency(insSavings);
    }

    function renderSalesChart(sales) {
        const ctx = document.getElementById('sales-over-time-chart').getContext('2d');
        const salesByDate = {};

        sales.forEach(sale => {
            const date = new Date(sale.created_at).toLocaleDateString();
            if (!salesByDate[date]) {
                salesByDate[date] = 0;
            }
            salesByDate[date] += sale.final_cost;
        });

        const labels = Object.keys(salesByDate).reverse();
        const data = Object.values(salesByDate).reverse();

        if (salesChart) {
            salesChart.destroy();
        }
        salesChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Daily Sales',
                    data: data,
                    borderColor: 'rgba(0, 122, 51, 1)',
                    backgroundColor: 'rgba(0, 122, 51, 0.1)',
                    fill: true,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false }, title: { display: true, text: 'Sales Over Time' } }
            }
        });
    }

    function renderCategoryChart(sales) {
        const ctx = document.getElementById('sales-by-category-chart').getContext('2d');
        const categorySales = { Exams: 0, Frames: 0, Lenses: 0, 'Add-Ons': 0 };

        sales.forEach(sale => {
            if (sale.quote_details) {
                if (sale.quote_details.exams?.length > 0) categorySales.Exams += sale.quote_details.exams.reduce((sum, item) => sum + item.price, 0);
                if (sale.quote_details.frame?.finalCost) categorySales.Frames += sale.quote_details.frame.finalCost;
                if (sale.quote_details.lenses) {
                    categorySales.Lenses += Object.values(sale.quote_details.lenses).reduce((sum, item) => sum + item.price, 0);
                }
                if (sale.quote_details.addOns?.length > 0) categorySales['Add-Ons'] += sale.quote_details.addOns.reduce((sum, item) => sum + item.price, 0);
            }
        });

        if (categoryChart) {
            categoryChart.destroy();
        }
        categoryChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(categorySales),
                datasets: [{
                    data: Object.values(categorySales),
                    backgroundColor: ['#007a33', '#55a630', '#aacc00', '#e6f2e9']
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'top' }, title: { display: true, text: 'Sales by Category (Glasses Only)' } }
            }
        });
    }

    function renderOpticianLeaderboard(sales) {
        const opticianStats = {};
        sales.forEach(sale => {
            const opticianId = sale.optician_id;
            if (!opticianStats[opticianId]) {
                opticianStats[opticianId] = { sales: 0, count: 0, store_id: sale.store_id };
            }
            opticianStats[opticianId].sales += sale.final_cost;
            opticianStats[opticianId].count++;
        });

        const leaderboardData = Object.entries(opticianStats).map(([id, stats]) => {
            const profile = allProfiles.find(p => p.id === id);
            const store = allStores.find(s => s.id.toString() === stats.store_id.toString());
            return {
                name: profile ? profile.full_name : 'Unknown User',
                store: store ? store.name : 'Unknown Store',
                totalSales: stats.sales,
                numSales: stats.count
            };
        }).sort((a, b) => b.totalSales - a.totalSales);

        const tableBody = document.getElementById('optician-leaderboard-body');
        tableBody.innerHTML = '';
        leaderboardData.forEach(data => {
            const row = document.createElement('tr');
            row.className = 'border-b';
            row.innerHTML = `
                <td class="p-2 font-medium">${data.name}</td>
                <td class="p-2 text-gray-600">${data.store}</td>
                <td class="p-2 text-right font-semibold">${formatCurrency(data.totalSales)}</td>
                <td class="p-2 text-right">${data.numSales}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    function renderRecentSales(sales) {
        const tableBody = document.getElementById('recent-sales-body');
        tableBody.innerHTML = '';
        sales.slice(0, 10).forEach(sale => {
            const profile = allProfiles.find(p => p.id === sale.optician_id);
            const row = document.createElement('tr');
            row.className = 'border-b';
            row.innerHTML = `
                <td class="p-2 font-medium">${sale.customer_name}</td>
                <td class="p-2 text-gray-600">${profile ? profile.full_name : 'N/A'}</td>
                <td class="p-2 text-right font-semibold">${formatCurrency(sale.final_cost)}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    // --- EVENT LISTENERS ---
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });

    document.getElementById('date-range-filter').addEventListener('change', updateDashboard);
    document.getElementById('store-filter').addEventListener('change', updateDashboard);


    // --- INITIALIZATION ---
    checkUser();

</script>
</body>
</html>
