<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pearle Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f8f9fa;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .kpi-card {
            padding: 1rem;
        }
        .kpi-title {
            color: #6b7280; /* gray-500 */
        }
        .kpi-value {
            color: var(--pearl-dark-green);
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" alt="Pearle Vision Logo" class="h-8">
        </div>
        <nav class="flex items-center space-x-4">
            <a href="./dashboard.html" class="text-sm font-bold text-pearl-green border-b-2 border-pearl-green">Dashboard</a>
            <a href="./admin.html" class="text-sm font-medium text-gray-600 hover:text-pearl-green">Management</a>
        </nav>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-8">
            <!-- Filters -->
            <div class="card">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="date-range-filter" class="block text-sm font-medium text-gray-700">Date Range</label>
                        <select id="date-range-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-pearl-green focus:border-pearl-green sm:text-sm rounded-md">
                            <option value="7">Last 7 Days</option>
                            <option value="30" selected>Last 30 Days</option>
                            <option value="90">Last 90 Days</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <div>
                        <label for="store-filter" class="block text-sm font-medium text-gray-700">Store</label>
                        <select id="store-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-pearl-green focus:border-pearl-green sm:text-sm rounded-md">
                            <option value="all">All Stores</option>
                            <!-- Store options will be populated by JS -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="card kpi-card"><h3 class="kpi-title">Total Sales</h3><p id="kpi-total-sales" class="text-3xl font-bold kpi-value">$0.00</p></div>
                <div class="card kpi-card"><h3 class="kpi-title">Total # of Sales</h3><p id="kpi-num-sales" class="text-3xl font-bold kpi-value">0</p></div>
                <div class="card kpi-card"><h3 class="kpi-title">Average Sale Value</h3><p id="kpi-avg-sale" class="text-3xl font-bold kpi-value">$0.00</p></div>
                <div class="card kpi-card"><h3 class="kpi-title">Insurance Savings</h3><p id="kpi-ins-savings" class="text-3xl font-bold kpi-value">$0.00</p></div>
            </div>

            <!-- Charts -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card"><canvas id="sales-over-time-chart"></canvas></div>
                <div class="card"><canvas id="sales-by-category-chart"></canvas></div>
            </div>

            <!-- Tables -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card">
                    <h3 class="text-xl font-bold mb-4">Optician Leaderboard</h3>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Name</th><th class="p-2">Store</th><th class="p-2 text-right">Total Sales</th><th class="p-2 text-right"># of Sales</th></tr></thead><tbody id="optician-leaderboard-body"></tbody></table></div>
                </div>
                <div class="card">
                    <h3 class="text-xl font-bold mb-4">Recent Sales</h3>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Customer</th><th class="p-2">Optician</th><th class="p-2 text-right">Amount</th></tr></thead><tbody id="recent-sales-body"></tbody></table></div>
                </div>
            </div>
        </div>
    </main>

<script type="module">
    import { supabase } from './supabase-client.js';

    // Global variables to hold data
    let allSales = [];
    let allProfiles = [];
    let allStores = [];
    let salesChart, categoryChart;

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html';
            return;
        }
        
        const { data: profile, error } = await supabase.from('profiles').select('role, full_name').eq('id', user.id).single();

        if (error || !profile || profile.role !== 'owner') {
            console.warn('Access Denied. User is not an owner or profile not found.');
            window.location.href = './calculator.html';
            return;
        }
        
        document.getElementById('user-display').textContent = `Welcome, ${profile.full_name || user.email}`;
        
        // If user is authorized, fetch all necessary data
        await fetchData();
    }

    async function fetchData() {
        console.log("Fetching data for dashboard...");
        const salesPromise = supabase.from('sales').select('*');
        const profilesPromise = supabase.from('profiles').select('id, full_name');
        const storesPromise = supabase.from('stores').select('*');

        const [salesResult, profilesResult, storesResult] = await Promise.all([salesPromise, profilesPromise, storesPromise]);

        if (salesResult.error || profilesResult.error || storesResult.error) {
            console.error("Error fetching dashboard data:", salesResult.error || profilesResult.error || storesResult.error);
            alert("Could not load dashboard data.");
            return;
        }
        
        allSales = salesResult.data;
        allProfiles = profilesResult.data;
        allStores = storesResult.data;

        console.log("Data fetched:", { sales: allSales.length, profiles: allProfiles.length, stores: allStores.length });

        populateStoreFilter();
        updateDashboard();
    }

    function populateStoreFilter() {
        const storeFilter = document.getElementById('store-filter');
        allStores.forEach(store => {
            const option = document.createElement('option');
            option.value = store.id;
            option.textContent = store.name;
            storeFilter.appendChild(option);
        });
    }

    function updateDashboard() {
        // This function will be expanded to filter data and render all components
        console.log("Updating dashboard...");
        // For now, it's a placeholder
    }

    // --- EVENT LISTENERS ---
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });

    document.getElementById('date-range-filter').addEventListener('change', updateDashboard);
    document.getElementById('store-filter').addEventListener('change', updateDashboard);


    // --- INITIALIZATION ---
    checkUser();

</script>
</body>
</html>
