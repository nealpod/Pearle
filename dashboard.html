<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pearle Vision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --light-gray: #f8f9fa;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .card {
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .kpi-title {
            color: #6b7280; /* gray-500 */
        }
        .kpi-value {
            color: var(--pearl-dark-green);
        }
        .summary-grid-item {
            border-right: 1px solid #e5e7eb; /* gray-200 */
            padding: 1rem;
        }
        .summary-grid-item:last-child {
            border-right: none;
        }
        .table-header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" alt="Pearle Vision Logo" class="h-8">
        </div>
        <nav class="flex items-center space-x-4">
            <a href="./dashboard.html" class="text-sm font-bold text-pearl-green border-b-2 border-pearl-green">Dashboard</a>
            <a href="./admin.html" class="text-sm font-medium text-gray-600 hover:text-pearl-green">Management</a>
        </nav>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto space-y-8">
            <div class="card">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="date-range-filter" class="block text-sm font-medium text-gray-700">Date Range</label>
                        <select id="date-range-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-pearl-green focus:border-pearl-green sm:text-sm rounded-md">
                            <option value="7">Last 7 Days</option>
                            <option value="30" selected>Last 30 Days</option>
                            <option value="90">Last 90 Days</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    <div>
                        <label for="store-filter" class="block text-sm font-medium text-gray-700">Store</label>
                        <select id="store-filter" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-pearl-green focus:border-pearl-green sm:text-sm rounded-md">
                            <option value="all">All Stores</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="custom-summary" class="card">
                <div class="grid grid-cols-1 md:grid-cols-5 text-center">
                    <div class="summary-grid-item">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Total Sales</h3>
                        <p id="summary-total-sales" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                    </div>
                    <div class="summary-grid-item">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Exams Sold</h3>
                        <p id="summary-exam-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-exam-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                    <div class="summary-grid-item">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Frames Sold</h3>
                        <p id="summary-frame-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-frame-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                    <div class="summary-grid-item">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Lens Pairs Sold</h3>
                        <p id="summary-lens-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-lens-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                    <div class="summary-grid-item">
                        <h3 class="kpi-title text-sm font-medium uppercase tracking-wider">Contact Sales</h3>
                        <p id="summary-contact-value" class="text-3xl font-bold kpi-value mt-1">$0.00</p>
                        <p id="summary-contact-count" class="text-sm text-gray-500 mt-1">0 units</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card"><h3 class="text-xl font-bold mb-4">Sales by $ Value</h3><canvas id="dollar-value-chart"></canvas></div>
                <div class="card"><h3 class="text-xl font-bold mb-4">Sales by # Units</h3><canvas id="unit-count-chart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="card">
                    <h3 class="text-xl font-bold mb-4">Optician Leaderboard</h3>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Name</th><th class="p-2">Store</th><th class="p-2 text-right">Total Sales</th><th class="p-2 text-right"># of Sales</th></tr></thead><tbody id="optician-leaderboard-body"></tbody></table></div>
                </div>
                <div class="card">
                    <div class="table-header-flex">
                        <h3 class="text-xl font-bold">Daily Sales</h3>
                        <input type="date" id="daily-sales-date-picker" class="border-gray-300 rounded-md shadow-sm text-sm">
                    </div>
                    <div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">Customer</th><th class="p-2">Optician</th><th class="p-2 text-right">Amount</th></tr></thead><tbody id="daily-sales-body"></tbody></table></div>
                </div>
            </div>
        </div>
    </main>

<script type="module">
    import { supabase } from './supabase-client.js';

    let allSales = [];
    let allProfiles = [];
    let allStores = [];
    // MODIFIED: salesChart variable removed
    let dollarValueChart, unitCountChart;

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) { window.location.href = './index.html'; return; }
        
        const { data: profile, error } = await supabase.from('profiles').select('role, full_name').eq('id', user.id).single();

        if (error || !profile || profile.role !== 'owner') { window.location.href = './calculator.html'; return; }
        
        document.getElementById('user-display').textContent = `Welcome, ${profile.full_name || user.email}`;
        await fetchData();
    }

    async function fetchData() {
        const [salesResult, profilesResult, storesResult] = await Promise.all([
            supabase.from('sales').select('*').order('created_at', { ascending: false }),
            supabase.from('profiles').select('id, full_name'),
            supabase.from('stores').select('*')
        ]);

        if (salesResult.error || profilesResult.error || storesResult.error) {
            console.error("Error fetching dashboard data:", salesResult.error || profilesResult.error || storesResult.error);
            return;
        }
        
        allSales = salesResult.data;
        allProfiles = profilesResult.data;
        allStores = storesResult.data;

        populateStoreFilter();
        updateDashboard();
        
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('daily-sales-date-picker').value = today;
        updateDailySalesTable();
    }

    function populateStoreFilter() {
        const storeFilter = document.getElementById('store-filter');
        allStores.forEach(store => {
            const option = document.createElement('option');
            option.value = store.id;
            option.textContent = store.name;
            storeFilter.appendChild(option);
        });
    }

    function getFilteredSales() {
        const dateFilter = document.getElementById('date-range-filter').value;
        const storeFilter = document.getElementById('store-filter').value;
        const now = new Date();
        
        return allSales.filter(sale => {
            const saleDate = new Date(sale.created_at);
            let dateCondition = true;
            if (dateFilter !== 'all') {
                const days = parseInt(dateFilter);
                const pastDate = new Date();
                pastDate.setDate(now.getDate() - days);
                dateCondition = saleDate >= pastDate;
            }
            const storeCondition = storeFilter === 'all' || sale.store_id.toString() === storeFilter;
            return dateCondition && storeCondition;
        });
    }

    function updateDashboard() {
        const filteredSales = getFilteredSales();
        const salesMetrics = calculateSalesMetrics(filteredSales);
        
        renderCustomSummary(salesMetrics);
        // MODIFIED: renderSalesChart call removed
        renderDollarValuePieChart(salesMetrics);
        renderUnitCountPieChart(salesMetrics);
        renderOpticianLeaderboard(filteredSales);
    }

    function calculateSalesMetrics(sales) {
        const metrics = {
            totalSalesValue: 0, examCount: 0, examValue: 0,
            frameCount: 0, frameValue: 0, lensCount: 0,
            lensValue: 0, contactCount: 0, contactValue: 0,
        };

        sales.forEach(sale => {
            metrics.totalSalesValue += sale.final_cost || 0;
            const details = sale.quote_details;

            if (details) {
                let examValueInThisSale = 0;
                if (details.exams && details.exams.length > 0) {
                    examValueInThisSale = details.exams.reduce((sum, item) => sum + (item.price || 0), 0);
                    metrics.examCount += details.exams.length;
                    metrics.examValue += examValueInThisSale;
                }

                if (details.type === 'Contacts') {
                    metrics.contactCount++;
                    metrics.contactValue += (sale.final_cost || 0) - examValueInThisSale;
                } else { 
                    if (details.frame && details.frame.price > 0) {
                        metrics.frameCount++;
                        metrics.frameValue += details.frame.finalCost || 0;
                    }
                    const lensesAndAddonsValue = (details.lenses ? Object.values(details.lenses).reduce((sum, item) => sum + item.price, 0) : 0) + 
                                                 (details.addOns ? details.addOns.reduce((sum, item) => sum + item.price, 0) : 0);
                    if (lensesAndAddonsValue > 0) {
                        metrics.lensCount++;
                        metrics.lensValue += lensesAndAddonsValue;
                    }
                }
            }
        });
        return metrics;
    }

    function renderCustomSummary(metrics) {
        document.getElementById('summary-total-sales').textContent = formatCurrency(metrics.totalSalesValue);
        document.getElementById('summary-exam-value').textContent = formatCurrency(metrics.examValue);
        document.getElementById('summary-exam-count').textContent = `${metrics.examCount} units`;
        document.getElementById('summary-frame-value').textContent = formatCurrency(metrics.frameValue);
        document.getElementById('summary-frame-count').textContent = `${metrics.frameCount} units`;
        document.getElementById('summary-lens-value').textContent = formatCurrency(metrics.lensValue);
        document.getElementById('summary-lens-count').textContent = `${metrics.lensCount} units`;
        document.getElementById('summary-contact-value').textContent = formatCurrency(metrics.contactValue);
        document.getElementById('summary-contact-count').textContent = `${metrics.contactCount} units`;
    }

    function renderPieChart(canvasId, chartInstance, labels, data) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        if (chartInstance) chartInstance.destroy();
        return new Chart(ctx, {
            type: 'pie',
            data: {
                labels: labels,
                datasets: [{ data: data, backgroundColor: ['#007a33', '#55a630', '#aacc00', '#e6f2e9'] }]
            },
            options: { responsive: true, plugins: { legend: { position: 'top' } } }
        });
    }

    function renderDollarValuePieChart(metrics) {
        const labels = ['Exams', 'Frames', 'Lenses', 'Contacts'];
        const data = [metrics.examValue, metrics.frameValue, metrics.lensValue, metrics.contactValue];
        dollarValueChart = renderPieChart('dollar-value-chart', dollarValueChart, labels, data);
    }

    function renderUnitCountPieChart(metrics) {
        const labels = ['Exams', 'Frames', 'Lens Pairs', 'Contact Sales'];
        const data = [metrics.examCount, metrics.frameCount, metrics.lensCount, metrics.contactCount];
        unitCountChart = renderPieChart('unit-count-chart', unitCountChart, labels, data);
    }
    
    // MODIFIED: renderSalesChart function removed

    function renderOpticianLeaderboard(sales) {
        const opticianStats = sales.reduce((acc, sale) => {
            const id = sale.optician_id;
            if (!acc[id]) acc[id] = { sales: 0, count: 0, store_id: sale.store_id };
            acc[id].sales += sale.final_cost;
            acc[id].count++;
            return acc;
        }, {});

        const leaderboardData = Object.entries(opticianStats).map(([id, stats]) => {
            const profile = allProfiles.find(p => p.id === id);
            const store = allStores.find(s => s.id.toString() === stats.store_id.toString());
            return { name: profile?.full_name || 'N/A', store: store?.name || 'N/A', sales: stats.sales, count: stats.count };
        }).sort((a, b) => b.sales - a.sales);

        const tableBody = document.getElementById('optician-leaderboard-body');
        tableBody.innerHTML = leaderboardData.map(data => `
            <tr class="border-b">
                <td class="p-2 font-medium">${data.name}</td>
                <td class="p-2 text-gray-600">${data.store}</td>
                <td class="p-2 text-right font-semibold">${formatCurrency(data.sales)}</td>
                <td class="p-2 text-right">${data.count}</td>
            </tr>
        `).join('');
    }
    
    function updateDailySalesTable() {
        const selectedDate = document.getElementById('daily-sales-date-picker').value;
        if (!selectedDate) return;

        const salesForDay = allSales.filter(sale => {
            return new Date(sale.created_at).toISOString().split('T')[0] === selectedDate;
        });
        renderDailySales(salesForDay);
    }

    function renderDailySales(sales) {
        const tableBody = document.getElementById('daily-sales-body');
        if (sales.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="3" class="text-center p-4 text-gray-500">No sales for this day.</td></tr>`;
            return;
        }
        tableBody.innerHTML = sales.map(sale => {
            const profile = allProfiles.find(p => p.id === sale.optician_id);
            return `<tr class="border-b">
                <td class="p-2 font-medium">${sale.customer_name}</td>
                <td class="p-2 text-gray-600">${profile?.full_name || 'N/A'}</td>
                <td class="p-2 text-right font-semibold">${formatCurrency(sale.final_cost)}</td>
            </tr>`;
        }).join('');
    }

    // --- EVENT LISTENERS ---
    document.getElementById('logout-btn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });

    document.getElementById('date-range-filter').addEventListener('change', updateDashboard);
    document.getElementById('store-filter').addEventListener('change', updateDashboard);
    document.getElementById('daily-sales-date-picker').addEventListener('change', updateDailySalesTable);

    checkUser();
</script>
</body>
</html>
