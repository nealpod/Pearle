<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Price Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --pearl-light-green: #e6f2e9;
            --light-gray: #f8f9fa;
            --border-gray: #e2e8f0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--pearl-green);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #cbd5e0;
        }
        .btn-remove {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 0.5rem;
        }
        .btn-remove:hover {
            background-color: #fee2e2;
        }
        .summary-value {
            font-weight: 500;
            color: #1a202c;
        }
        .summary-total-final {
            color: var(--pearl-dark-green);
        }
        .summary-item-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
            padding-top: 0;
            padding-bottom: 0;
        }
        .summary-item-details.open {
            max-height: 200px; /* Adjust as needed */
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .summary-item-header {
            cursor: pointer;
        }
        .component-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .component-price {
            font-weight: 500;
            color: var(--pearl-dark-green);
        }
        .input-group {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
        .input-group.error {
            border-color: #ef4444; /* red-500 */
            box-shadow: 0 0 0 1px #ef4444;
        }
        /* Style for the Glasses/Contacts toggle button */
        .calculator-toggle {
            display: flex;
            border: 1px solid var(--pearl-green);
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .calculator-toggle button {
            padding: 0.5rem 1rem;
            border: none;
            background-color: white;
            color: var(--pearl-green);
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .calculator-toggle button.active {
            background-color: var(--pearl-green);
            color: white;
            cursor: default;
        }
        .calculator-toggle button:not(.active):hover {
            background-color: var(--pearl-light-green);
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" class="h-8" alt="Pearle Vision Logo">
        </div>

        <!-- Calculator Toggle Button -->
        <div class="calculator-toggle">
            <button class="active" onclick="window.location.href='./calculator.html'">Glasses</button>
            <button onclick="window.location.href='./contacts.html'">Contacts</button>
        </div>
        
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-2 space-y-6">

                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Customer & Exam</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="input-group space-y-2">
                            <label for="customer-name" class="block text-sm font-medium text-gray-700">Customer Name</label>
                            <input type="text" id="customer-name" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                        </div>
                        <div class="input-group space-y-2">
                            <label for="insurance-type-select" class="block text-sm font-medium text-gray-700">Insurance</label>
                            <select id="insurance-type-select" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                                <option>Other Insurance</option>
                                <option>VSP</option>
                                <option>Declining Balance</option>
                            </select>
                        </div>
                        <div id="declining-balance-inputs" class="md:col-span-2 grid grid-cols-2 gap-2 input-group" style="display: none;">
                            <div class="space-y-1">
                                <label for="global-allowance" class="block text-sm font-medium text-gray-700">Global Allowance</label>
                                <input type="text" inputmode="decimal" id="global-allowance" placeholder="Allowance" class="config-input dollar-format w-full border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                            <div class="space-y-1">
                                <label for="global-discount" class="block text-sm font-medium text-gray-700">Global Discount</label>
                                <input type="text" inputmode="decimal" id="global-discount" placeholder="Discount" class="config-input percent-format w-full border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                        </div>
                        <!-- ADDED: Container for the new exam options -->
                        <div id="exam-options-grid" class="md:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4 border-t pt-4 mt-4">
                            <!-- Exam inputs will be dynamically inserted here -->
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Frame & Lens Configuration</h3>
                    
                    <div id="frame-group" class="md:col-span-2 input-group space-y-2 mb-4">
                        <div class="component-label">
                            <label for="frame-retail-price" class="block font-medium text-gray-700">Frame Details</label>
                            <span id="price-frame" class="component-price"></span>
                        </div>
                        <div class="flex items-center space-x-2">
                           <input type="text" inputmode="decimal" id="frame-retail-price" placeholder="Price" class="config-input w-2/4 border-gray-300 rounded-md shadow-sm dollar-format">
                           <input type="text" inputmode="decimal" id="allowance-frame" placeholder="Allowance" class="config-input dollar-format w-1/4 border-gray-300 rounded-md shadow-sm text-sm">
                           <input type="text" inputmode="decimal" id="discount-frame" placeholder="Discount" class="config-input percent-format w-1/4 border-gray-300 rounded-md shadow-sm text-sm">
                        </div>
                    </div>
                    
                    <div id="dynamic-options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                               </div>
                </div>

            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow sticky top-24">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Quote Summary</h3>
                    <div id="summary-items" class="space-y-1 text-sm">
                       <p class="text-gray-500">Your selections will appear here.</p>
                    </div>
                    <div class="border-t my-4"></div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Retail Total</span>
                            <span id="summary-retail" class="summary-value">$0.00</span>
                        </div>
                        <div class="border-b border-gray-200 pb-1">
                            <div class="summary-item-header flex justify-between items-center" onclick="toggleDetails('summary-ins-svgs-details')">
                                <span class="text-gray-600">Insurance Savings</span>
                                <span id="summary-ins-svgs" class="summary-value">$0.00</span>
                            </div>
                            <div id="summary-ins-svgs-details" class="summary-item-details bg-gray-50 rounded px-3 text-gray-600">
                            </div>
                        </div>
                    </div>
                    <div class="border-t my-4"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold">Final Cost</span>
                        <span id="summary-final-cost" class="text-2xl font-bold summary-total-final">$0.00</span>
                    </div>

                    <div class="mt-6 flex space-x-2">
                        <button id="reset-button" class="btn btn-secondary w-full">Reset</button>
                        <button id="save-quote-button" class="btn btn-primary w-full">Save Quote</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="error-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-2">Invalid Price Calculation</h3>
                <div class="mt-2 px-7 py-3">
                    <p id="error-modal-message" class="text-sm text-gray-500"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="close-error-modal-btn" class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-300">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>


<script type="module">
    import { supabase } from './supabase-client.js';

    // Data will be populated from Supabase
    let priceListData = [];
    let examListData = []; // ADDED: For exam data

    // Element references
    const optionsGrid = document.getElementById('dynamic-options-grid');
    const examOptionsGrid = document.getElementById('exam-options-grid'); // ADDED: Exam grid reference
    const summaryItemsEl = document.getElementById('summary-items');
    const logoutBtn = document.getElementById('logout-btn');
    let addonCounter = 0;
    
    // --- AUTH & DATA FETCHING ---

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html';
        } else {
            document.getElementById('user-display').textContent = `Welcome, ${user.email}`;
            fetchData(); 
        }
    }

    // MODIFIED: Fetch data from both 'components' and 'exams' tables
    async function fetchData() {
        const componentsPromise = supabase.from('components').select('*').eq('is_active', true);
        const examsPromise = supabase.from('exams').select('*').eq('is_active', true);

        const [componentsResult, examsResult] = await Promise.all([componentsPromise, examsPromise]);

        if (componentsResult.error || examsResult.error) {
            const errorMsg = componentsResult.error?.message || examsResult.error?.message;
            console.error("Error fetching data:", errorMsg);
            showErrorModal("Could not load pricing data. Please contact support. Error: " + errorMsg);
            return;
        }
        
        priceListData = [{ "Item": "None", "Category": "All", "Retail": 0 }, ...componentsResult.data];
        // Note: The column names from your Supabase table should match what's used here (exam_type, price_retail)
        examListData = [{ "exam_type": "None", "Category": "All", "price_retail": 0 }, ...examsResult.data];
        
        initializeCalculator();
    }

    logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });


    // --- CALCULATOR LOGIC ---

    // Lens/Add-on categories
    const categories = [
        { id: 'Rx', label: 'Rx' },
        { id: 'Lens Type', label: 'Lens Design' }, 
        { id: 'Material', label: 'Material' },
        { id: 'Coatings', label: 'Coatings' },
        { id: 'Backside UV', label: 'Backside UV' },
        { id: 'Edge Polish', label: 'Edge Polish' }, 
        { id: 'Color', label: 'Color' }, 
        { id: "Custom Measurements", label: "Custom Measurements" },
        { id: 'Blue Light', label: 'Blue Light Filter' },
        { id: 'Protection', label: '1Yr. Protection' },
        { id: 'Add-Ons', label: 'Add-Ons' }
    ];
    
    // ADDED: Exam categories
    const examCategories = [
        { id: 'eye-exam', label: 'Eye Exam', type: 'select' },
        { id: 'refraction', label: 'Refraction', type: 'checkbox' },
        { id: 'contacts-exam', label: 'Contacts Exam', type: 'select' },
        { id: 'retinal-fundus-photos', label: 'Retinal Fundus Photos', type: 'checkbox' }
    ];

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    const toId = (str) => str.replace(/[\s./]+/g, '-').toLowerCase();

    const onFocus = (event) => {
        let value = event.target.value;
        value = value.replace(/[$,%]/g, '');
        event.target.value = value;
    };

    const onBlur = (event) => {
        let value = event.target.value;
        if (value) {
            if (event.target.classList.contains('dollar-format')) event.target.value = `$${value}`;
            else if (event.target.classList.contains('percent-format')) event.target.value = `${value}%`;
        }
    };
    
    function showErrorModal(message) {
        const modal = document.getElementById('error-modal');
        const modalMessage = document.getElementById('error-modal-message');
        modalMessage.textContent = message;
        modal.classList.remove('hidden');
    }
    
    // ADDED: New function to build exam inputs
    function buildExamInputs() {
        examOptionsGrid.innerHTML = '';
        examCategories.forEach(cat => {
            const container = document.createElement('div');
            container.id = `container-${cat.id}`;
            container.className = 'input-group space-y-2';

            if (cat.type === 'select') {
                const options = examListData.filter(e => e.Category === cat.label && e.exam_type !== 'None');
                const allOptions = [examListData.find(e => e.exam_type === 'None'), ...options];
                container.innerHTML = `
                    <div class="component-label">
                        <label for="select-${cat.id}" class="font-medium text-gray-700">${cat.label}</label>
                        <span id="price-${cat.id}" class="component-price"></span>
                    </div>
                    <select id="select-${cat.id}" data-category="${cat.label}" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                        ${allOptions.map(o => o && `<option value="${o.exam_type}">${o.exam_type}</option>`).join('')}
                    </select>
                `;
            } else { // Checkbox
                const singleOption = examListData.find(e => e.Category === cat.label);
                if (!singleOption) return; // Don't build if data not found
                container.innerHTML = `
                    <div class="component-label">
                         <label class="flex items-center cursor-pointer">
                             <input type="checkbox" id="checkbox-${cat.id}" data-item-name="${singleOption.exam_type}" class="config-option h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                             <span class="ml-2 font-medium text-gray-700">${cat.label}</span>
                         </label>
                         <span id="price-${cat.id}" class="component-price"></span>
                    </div>
                `;
            }

            // Add allowance/discount/copay inputs to all exam items
            container.innerHTML += `
                <div class="flex space-x-1">
                    <input type="text" inputmode="decimal" id="allowance-${cat.id}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                    <input type="text" inputmode="decimal" id="discount-${cat.id}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                    <input type="text" inputmode="decimal" id="copay-${cat.id}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                </div>
            `;
            examOptionsGrid.appendChild(container);
        });

        // Add special event listener for Eye Exam -> Refraction rule
        const eyeExamSelect = document.getElementById('select-eye-exam');
        const refractionCheckbox = document.getElementById('checkbox-refraction');
        if (eyeExamSelect && refractionCheckbox) {
            eyeExamSelect.addEventListener('change', () => {
                if (eyeExamSelect.value !== 'None') {
                    refractionCheckbox.checked = true;
                }
                updateCalculations(); // Trigger recalculation
            });
        }
    }


    function buildInputs() {
        optionsGrid.innerHTML = '';
        categories.forEach(cat => {
            const catId = toId(cat.id);
            const container = document.createElement('div');
            container.id = `container-${catId}`;

            if (cat.id === 'Add-Ons') {
                container.className = 'md:col-span-2 space-y-2';
                container.innerHTML = `
                    <h4 class="font-medium text-gray-700">${cat.label}</h4>
                    <div id="addons-repeater-container" class="space-y-3"></div>
                    <button id="add-addon-btn" type="button" class="btn btn-primary text-sm px-3 py-1">+ Add Add-On</button>
                `;
            } else {
                container.className = 'input-group space-y-2';
                const options = priceListData.filter(p => p.Category === cat.id && !p.Item.toLowerCase().startsWith('no ') && p.Item !== 'None');

                if (options.length <= 1 && cat.id !== 'Rx' && cat.id !== 'Coatings' && cat.id !== 'Color' && cat.id !== 'Material' && cat.id !== 'Lens Type') {
                    const singleOption = options[0] || { Item: cat.label };
                    const isCheckedDefault = (cat.id === 'Edge Polish') ? 'checked' : ''; 
                    container.innerHTML = `
                        <div class="component-label">
                             <label class="flex items-center cursor-pointer">
                                 <input type="checkbox" id="checkbox-${catId}" data-item-name="${singleOption.Item}" ${isCheckedDefault} class="config-option h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                                 <span class="ml-2 font-medium text-gray-700">${cat.label}</span>
                             </label>
                             <span id="price-${catId}" class="component-price"></span>
                        </div>
                        <div class="flex space-x-1">
                            <input type="text" inputmode="decimal" id="allowance-${catId}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                            <input type="text" inputmode="decimal" id="discount-${catId}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                            <input type="text" inputmode="decimal" id="copay-${catId}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                        </div>
                    `;
                } else {
                    const allOptions = [priceListData.find(p => p.Item === 'None'), ...options];
                    container.innerHTML = `
                        <div class="component-label">
                            <label for="select-${catId}" class="font-medium text-gray-700">${cat.label}</label>
                            <span id="price-${catId}" class="component-price"></span>
                        </div>
                        <select id="select-${catId}" data-category="${cat.id}" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                            ${allOptions.map(o => o && `<option value="${o.Item}">${o.Item}</option>`).join('')}
                        </select>
                        <div class="flex space-x-1">
                            <input type="text" inputmode="decimal" id="allowance-${catId}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                            <input type="text" inputmode="decimal" id="discount-${catId}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                            <input type="text" inputmode="decimal" id="copay-${catId}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                        </div>
                    `;
                }
            }
            
            optionsGrid.appendChild(container);

            if (cat.id === 'Protection') {
                const vspCopayContainer = document.createElement('div');
                vspCopayContainer.id = 'container-material-co-pay';
                vspCopayContainer.className = 'input-group space-y-2'; 
                vspCopayContainer.style.display = 'none';
                vspCopayContainer.innerHTML = `
                    <div class="component-label">
                        <label class="font-medium text-gray-700">VSP Material Co-Pay</label>
                        <span id="price-material-co-pay" class="component-price"></span>
                    </div>
                    <div class="flex">
                        <input type="text" inputmode="decimal" id="copay-material-co-pay" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                    </div>
                `;
                optionsGrid.appendChild(vspCopayContainer);
            }
        });

        document.getElementById('add-addon-btn').addEventListener('click', addAddonRow);
        document.getElementById('close-error-modal-btn').addEventListener('click', () => {
             document.getElementById('error-modal').classList.add('hidden');
        });
        // Note: attachEventListeners() is now called once in initializeCalculator()
    }

    function addAddonRow() {
        addonCounter++;
        const repeaterContainer = document.getElementById('addons-repeater-container');
        
        const addonRow = document.createElement('div');
        addonRow.id = `addon-row-${addonCounter}`;
        addonRow.className = 'addon-row input-group space-y-2';

        const allAddonItems = priceListData.filter(p => p.Category === 'Add-Ons');
        const optionsHTML = allAddonItems.map(o => `<option value="${o.Item}">${o.Item}</option>`).join('');

        addonRow.innerHTML = `
            <div class="component-label">
                   <select id="select-addon-${addonCounter}" class="addon-select config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                    ${optionsHTML}
                </select>
                <span id="price-addon-${addonCounter}" class="component-price ml-2"></span>
            </div>
            <div class="flex space-x-1">
                <input type="text" inputmode="decimal" id="allowance-addon-${addonCounter}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                <input type="text" inputmode="decimal" id="discount-addon-${addonCounter}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                <input type="text" inputmode="decimal" id="copay-addon-${addonCounter}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
            </div>
            <button type="button" class="btn-remove btn" data-row-id="${addonCounter}">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash" viewBox="0 0 16 16">
                    <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/>
                    <path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/>
                </svg>
            </button>
        `;

        repeaterContainer.appendChild(addonRow);
        updateAddonDropdowns();
        attachEventListeners(); // Re-attach for new row
        updateCalculations();
    }
    
    function updateAddonDropdowns() {
        const allAddonItems = priceListData.filter(p => p.Category === 'Add-Ons' && p.Item !== 'No Extras');
        const selectedAddons = Array.from(document.querySelectorAll('.addon-select')).map(select => select.value);
        
        document.querySelectorAll('.addon-select').forEach(select => {
            const currentValue = select.value;
            let optionsHTML = '<option value="No Extras">No Extras</option>';
            allAddonItems.forEach(item => {
                if (item.Item === currentValue || !selectedAddons.includes(item.Item)) {
                    optionsHTML += `<option value="${item.Item}">${item.Item}</option>`;
                }
            });
            select.innerHTML = optionsHTML;
            select.value = currentValue;
        });

        const addButton = document.getElementById('add-addon-btn');
        const availableAddons = allAddonItems.length - selectedAddons.filter(item => item !== 'No Extras').length;
        addButton.disabled = availableAddons <= 0;
    }

    function attachEventListeners() {
        // This function now attaches listeners to ALL relevant inputs on the page
        document.querySelectorAll('.config-option, .config-input').forEach(el => {
            el.removeEventListener('input', updateCalculations);
            el.addEventListener('input', updateCalculations);
            if (el.classList.contains('dollar-format') || el.classList.contains('percent-format')) {
                el.removeEventListener('focus', onFocus);
                el.removeEventListener('blur', onBlur);
                el.addEventListener('focus', onFocus);
                el.addEventListener('blur', onBlur);
            }
        });

        document.querySelectorAll('.btn-remove').forEach(button => {
            button.removeEventListener('click', removeAddonRow);
            button.addEventListener('click', removeAddonRow);
        });

         document.querySelectorAll('.addon-select').forEach(select => {
            select.removeEventListener('change', updateAddonDropdowns);
            select.addEventListener('change', updateAddonDropdowns);
        });
    }

    function removeAddonRow(event) {
        const rowId = event.currentTarget.dataset.rowId;
        document.getElementById(`addon-row-${rowId}`).remove();
        updateAddonDropdowns();
        updateCalculations();
    }


    function getCleanValue(elementId) {
        const el = document.getElementById(elementId);
        if (el && el.value) {
            return parseFloat(el.value.replace(/[$,%]/g, '')) || 0;
        }
        return 0;
    }

    function updateRxDropdown() {
        const insuranceType = document.getElementById('insurance-type-select').value;
        const rxSelect = document.getElementById('select-rx');
        if (!rxSelect) return;
        
        const baseRxItems = priceListData.filter(p => p.Category === 'Rx' && p.Item !== 'None');
        
        const vspItems = baseRxItems.filter(p => p.Item.includes('VSP') || p.Item === 'S.V.' || p.Item === 'BiFocal');
        const otherItems = baseRxItems.filter(p => !p.Item.includes('VSP') || p.Item === 'S.V.' || p.Item === 'BiFocal');
        
        const optionsToShow = [{ Item: 'None' }, ...(insuranceType === 'VSP' ? vspItems : otherItems)];
        const optionValuesToShow = optionsToShow.map(o => o.Item);
        
        const currentRxValue = rxSelect.value;
        rxSelect.innerHTML = optionsToShow.map(opt => `<option value="${opt.Item}">${opt.Item}</option>`).join('');

        if (optionValuesToShow.includes(currentRxValue)) {
            rxSelect.value = currentRxValue;
        } else {
            rxSelect.value = 'None';
        }
    }


    function updateCoatingsDropdown() {
        const insuranceType = document.getElementById('insurance-type-select').value;
        const coatingsSelect = document.getElementById('select-coatings');
        if (!coatingsSelect) return;
        
        const baseCoatingItems = priceListData.filter(p => p.Category === 'Coatings' && p.Item !== 'None');
        
        const vspItems = baseCoatingItems.filter(p => p.Item.match(/- [A-Z]$/));
        const otherItems = baseCoatingItems.filter(p => !p.Item.match(/- [A-Z]$/));
        
        const optionsToShow = [{ Item: 'None' }, ...(insuranceType === 'VSP' ? vspItems : otherItems)];
        const optionValuesToShow = optionsToShow.map(o => o.Item);
        
        const currentCoatingValue = coatingsSelect.value;
        coatingsSelect.innerHTML = optionsToShow.map(opt => `<option value="${opt.Item}">${opt.Item}</option>`).join('');
        
        if (optionValuesToShow.includes(currentCoatingValue)) {
            coatingsSelect.value = currentCoatingValue;
        } else {
            coatingsSelect.value = 'None';
        }
    }

    function calculateItem(retail, insAllow, discount, copay, isFrame = false) {
        let finalCost, yourCost, insSvgs;

        if (insAllow === 0 && discount === 0 && copay > 0) {
            finalCost = copay;
            yourCost = 0; 
            insSvgs = retail - finalCost;
        } else { 
            if (isFrame) {
                 yourCost = (retail - insAllow) * (1 - (discount / 100));
            } else {
                 yourCost = retail * (1 - (discount / 100)) - insAllow;
            }
            yourCost = Math.max(0, yourCost);
            finalCost = yourCost + copay;
            insSvgs = retail - finalCost;
        }
        
        const isError = retail > 0 && finalCost > retail;
        return { yourCost, finalCost, insSvgs, isError };
    }


    function updateCalculations() {
        document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
        let errorFound = false;

        const insuranceType = document.getElementById('insurance-type-select').value;
        const isDecliningBalance = (insuranceType === 'Declining Balance');

        let totalRetail = 0, totalInsSvgs = 0, totalFinalCost = 0;

        updateRxDropdown(); 
        updateCoatingsDropdown();

        const rxSelect = document.getElementById('select-rx');
        const lensTypeSelect = document.getElementById('select-lens-type');
        if (rxSelect && lensTypeSelect) {
            const rxValue = rxSelect.value;
            let targetLensType = 'None';
            if (rxValue.includes('S.V.')) targetLensType = 'S.V. Digital Aspheric';
            else if (rxValue.includes('BiFocal')) targetLensType = 'BiFocal Digital Aspheric';
            else if (rxValue.startsWith('PG')) targetLensType = 'Prog. Digital Aspheric';
            
            const optionExists = Array.from(lensTypeSelect.options).some(option => option.value === targetLensType);

            if (optionExists) {
                lensTypeSelect.value = targetLensType;
                lensTypeSelect.disabled = (targetLensType !== 'None');
            } else {
                lensTypeSelect.value = 'None';
                lensTypeSelect.disabled = false;
            }
        }

        const coatingsSelect = document.getElementById('select-coatings');
        const backsideUVCheckbox = document.getElementById('checkbox-backside-uv');
        if (coatingsSelect && backsideUVCheckbox) {
            backsideUVCheckbox.checked = (coatingsSelect.value === 'Premium Plus A.R.');
        }

        // --- Handle visibility of global vs. individual inputs ---
        document.getElementById('declining-balance-inputs').style.display = isDecliningBalance ? 'grid' : 'none';
        
        // This selector now targets ALL allowance/discount/copay inputs across the page
        document.querySelectorAll('[id^="allowance-"], [id^="discount-"], [id^="copay-"]').forEach(input => {
            // Exclude the global inputs
            if (input.id.startsWith('global-')) return;

            // VSP Material Co-Pay has only a copay field
            if (input.id === 'copay-material-co-pay') {
                const container = document.getElementById('container-material-co-pay');
                if (container) container.style.display = (insuranceType === 'VSP' && !isDecliningBalance) ? 'block' : 'none';
                if (container && container.style.display === 'none') input.value = '';
                return; // Skip to next input
            }
            
            input.style.display = isDecliningBalance ? 'none' : 'block';
            if (isDecliningBalance) input.value = '';
        });


        summaryItemsEl.innerHTML = '<p class="text-gray-500 initial-text">Your selections will appear here.</p>'; 
        let summaryContent = '';

        // --- Process Exam Items ---
        examCategories.forEach(cat => {
            const catId = cat.id;
            const priceEl = document.getElementById(`price-${catId}`);
            let selectedValue;

            const checkbox = document.getElementById(`checkbox-${catId}`);
            if (checkbox) {
                if(checkbox.checked) selectedValue = checkbox.dataset.itemName;
            } else {
                 const select = document.getElementById(`select-${catId}`);
                 if (select) selectedValue = select.value;
            }

            if (!selectedValue || selectedValue === "None") { 
                if(priceEl) priceEl.textContent = ''; 
                return; 
            }
            
            // Use examListData here
            const selectedItem = examListData.find(p => p.exam_type === selectedValue);
            if (!selectedItem) return;

            const inputs = {
                retail: selectedItem.price_retail, // Use correct price column
                insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-${catId}`),
                discount: isDecliningBalance ? 0 : getCleanValue(`discount-${catId}`),
                copay: isDecliningBalance ? 0 : getCleanValue(`copay-${catId}`),
            };

            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) {
                errorFound = true;
                showErrorModal(`The final price for ${cat.label} cannot exceed its retail price.`);
                document.getElementById(`container-${catId}`).classList.add('error');
            }
            totalRetail += inputs.retail;
            if (!isDecliningBalance) {
                totalInsSvgs += calc.insSvgs;
                totalFinalCost += calc.finalCost;
            }
            summaryContent += createSummaryItemHTML(catId, cat.label, inputs, calc);
            if (priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });

        // --- Process Frame Details ---
        const frameRetail = getCleanValue('frame-retail-price');
        if (frameRetail > 0) {
            const frameInsAllow = isDecliningBalance ? 0 : getCleanValue('allowance-frame');
            const frameDiscount = isDecliningBalance ? 0 : getCleanValue('discount-frame');
            const frameCopay = 0; 
            const frameCalc = calculateItem(frameRetail, frameInsAllow, frameDiscount, frameCopay, true);
            if (frameCalc.isError && !errorFound) {
                errorFound = true;
                showErrorModal("The final price for the Frame cannot exceed its retail price.");
                document.getElementById('frame-group').classList.add('error');
            }
            totalRetail += frameRetail;
            if (!isDecliningBalance) {
                totalInsSvgs += frameCalc.insSvgs;
                totalFinalCost += frameCalc.finalCost;
            }
            summaryContent += createSummaryItemHTML('frame', 'Frame', {retail: frameRetail, insAllow: frameInsAllow, discount: frameDiscount, copay: frameCopay}, frameCalc);
            document.getElementById('price-frame').textContent = formatCurrency(isDecliningBalance ? frameRetail : frameCalc.finalCost);
        } else {
            document.getElementById('price-frame').textContent = '';
        }

        // --- Process Lens & Add-On Configuration categories ---
        categories.forEach(cat => {
            if (cat.id === 'Add-Ons') return;
            if (cat.id === 'Protection' && insuranceType === 'VSP') return; 

            const catId = toId(cat.id);
            const priceEl = document.getElementById(`price-${catId}`);
            let selectedValue;
            const checkbox = document.getElementById(`checkbox-${catId}`);
            if (checkbox) {
                if(checkbox.checked) selectedValue = checkbox.dataset.itemName;
            } else {
                 const select = document.getElementById(`select-${catId}`);
                 if (select) selectedValue = select.value;
            }

            if (!selectedValue || selectedValue === "None") { 
                if(priceEl) priceEl.textContent = ''; 
                return; 
            }
            
            const selectedItem = priceListData.find(p => p.Item === selectedValue);
            if (!selectedItem) return;

            const inputs = {
                retail: selectedItem.Retail,
                insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-${catId}`),
                discount: isDecliningBalance ? 0 : getCleanValue(`discount-${catId}`),
                copay: isDecliningBalance ? 0 : getCleanValue(`copay-${catId}`),
            };

            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) {
                errorFound = true;
                showErrorModal(`The final price for ${cat.label} cannot exceed its retail price.`);
                document.getElementById(`container-${catId}`).classList.add('error');
            }
            totalRetail += inputs.retail;
            if (!isDecliningBalance) {
                totalInsSvgs += calc.insSvgs;
                totalFinalCost += calc.finalCost;
            }
            summaryContent += createSummaryItemHTML(catId, cat.label, inputs, calc);
            if (priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });
        
        // --- Process Add-On rows ---
        document.querySelectorAll('.addon-row').forEach(row => {
            const rowId = row.id.split('-').pop();
            const select = document.getElementById(`select-addon-${rowId}`);
            const itemName = select.value;
            const priceEl = document.getElementById(`price-addon-${rowId}`);

            if (itemName === 'No Extras') {
                if(priceEl) priceEl.textContent = '';
                return;
            }

            const selectedItem = priceListData.find(p => p.Item === itemName);
            if (!selectedItem) return;

            const inputs = {
                retail: selectedItem.Retail,
                insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-addon-${rowId}`),
                discount: isDecliningBalance ? 0 : getCleanValue(`discount-addon-${rowId}`),
                copay: isDecliningBalance ? 0 : getCleanValue(`copay-addon-${rowId}`),
            };

            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) {
                errorFound = true;
                showErrorModal(`The final price for ${itemName} cannot exceed its retail price.`);
                row.classList.add('error');
            }
            totalRetail += inputs.retail;
            if (!isDecliningBalance) {
                totalInsSvgs += calc.insSvgs;
                totalFinalCost += calc.finalCost;
            }
            summaryContent += createSummaryItemHTML(`addon-${rowId}`, itemName, inputs, calc);
            if(priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });

        // --- Final Calculation based on insurance type ---
        if (isDecliningBalance) {
            const globalAllowance = getCleanValue('global-allowance');
            const globalDiscount = getCleanValue('global-discount');
            totalFinalCost = (totalRetail - globalAllowance) * (1 - (globalDiscount / 100));
            totalFinalCost = Math.max(0, totalFinalCost);
            totalInsSvgs = totalRetail - totalFinalCost;
        } else {
            const vspCopayValue = getCleanValue('copay-material-co-pay');
            if (insuranceType === 'VSP' && vspCopayValue > 0) {
                totalFinalCost += vspCopayValue; 
                const vspInputs = { retail: 0, insAllow: 0, discount: 0, copay: vspCopayValue };
                const vspOutputs = { yourCost: 0, insSvgs: -vspCopayValue, finalCost: vspCopayValue };
                summaryContent += createSummaryItemHTML('material-co-pay', 'VSP Material Co-Pay', vspInputs, vspOutputs);
                document.getElementById('price-material-co-pay').textContent = formatCurrency(vspCopayValue);
            }
        }

        if(summaryContent) {
            summaryItemsEl.innerHTML = summaryContent;
        }

        const insSavingsDetailsEl = document.getElementById('summary-ins-svgs-details');
        if (isDecliningBalance) {
            const globalAllowance = getCleanValue('global-allowance');
            const globalDiscount = getCleanValue('global-discount');
            const calculatedDiscountAmount = (totalRetail - globalAllowance) * (globalDiscount / 100);
            insSavingsDetailsEl.innerHTML = `
                <div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Global Allowance</span><span>-${formatCurrency(globalAllowance)}</span></div>
                <div class="flex justify-between text-xs pt-1"><span>Global Discount (${globalDiscount}%)</span><span>-${formatCurrency(calculatedDiscountAmount)}</span></div>
            `;
            insSavingsDetailsEl.classList.add('open');
        } else {
            insSavingsDetailsEl.innerHTML = '';
            insSavingsDetailsEl.classList.remove('open');
        }

        document.getElementById('summary-retail').textContent = formatCurrency(totalRetail);
        document.getElementById('summary-ins-svgs').textContent = formatCurrency(totalInsSvgs);
        document.getElementById('summary-final-cost').textContent = formatCurrency(totalFinalCost);
    }

    function createSummaryItemHTML(id, title, inputs, outputs) {
        let discountCalcAmount; 
        const insuranceType = document.getElementById('insurance-type-select').value;
        const isDecliningBalance = (insuranceType === 'Declining Balance');

        if (id === 'frame') {
            discountCalcAmount = (inputs.retail - inputs.insAllow) * (inputs.discount / 100);
        } else {
            discountCalcAmount = inputs.retail * (inputs.discount / 100);
        }
        
        let copayHTML = '';
        if (inputs.copay > 0) { 
             copayHTML = `<div class="flex justify-between text-xs pt-1"><span>Co-Pay</span><span>+${formatCurrency(inputs.copay)}</span></div>`;
        }

        return `
            <div class="border-b border-gray-200 pb-1">
                <div class="summary-item-header flex justify-between items-center" onclick="toggleDetails('details-${id}')">
                    <span class="font-medium">${title}</span>
                    <span class="font-semibold">${formatCurrency(isDecliningBalance ? inputs.retail : outputs.finalCost)}</span>
                </div>
                <div id="details-${id}" class="summary-item-details bg-gray-50 rounded px-3 text-gray-600">
                    <div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Retail</span><span>${formatCurrency(inputs.retail)}</span></div>
                    ${!isDecliningBalance ? `<div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Ins. Allowance</span><span>-${formatCurrency(inputs.insAllow)}</span></div>` : ''}
                    ${!isDecliningBalance ? `<div class="flex justify-between text-xs ${inputs.copay > 0 ? 'border-b border-gray-200 py-1' : 'pt-1'}"><span>Discount (${inputs.discount}%)</span><span>-${formatCurrency(discountCalcAmount)}</span></div>` : ''}
                    ${!isDecliningBalance ? copayHTML : ''}
                </div>
            </div>
        `;
    }

    window.toggleDetails = function(id) {
        const detailsEl = document.getElementById(id);
        if(detailsEl) {
            detailsEl.classList.toggle('open');
        }
    }

    function resetCalculator() {
        // This selector now clears all inputs across all sections
        document.querySelectorAll('.config-input, #customer-name').forEach(el => el.value = ''); 
        document.querySelectorAll('.config-option').forEach(el => {
            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0; 
            } else if (el.type === 'checkbox') {
                el.checked = false; 
            }
        });

        document.getElementById('addons-repeater-container').innerHTML = '';
        addonCounter = 0; 

        const edgePolishCheckbox = document.getElementById('checkbox-edge-polish');
        if (edgePolishCheckbox) { 
            edgePolishCheckbox.checked = true;
        }

        updateCalculations();
    }

    function initializeCalculator() {
        buildExamInputs(); // Build exam inputs first
        buildInputs(); // Then build lens/frame inputs
        
        document.getElementById('reset-button').addEventListener('click', resetCalculator);
        document.getElementById('save-quote-button').addEventListener('click', () => {
            console.log("Quote saved (placeholder).");
        });

        // This single call now handles all event listeners
        attachEventListeners();
        
        // Add listener for insurance type change
        document.getElementById('insurance-type-select').addEventListener('change', updateCalculations);

        updateCalculations();
    }

    // --- INITIALIZATION ---
    checkUser();
</script>
