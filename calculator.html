<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Price Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --pearl-light-green: #e6f2e9;
            --light-gray: #f8f9fa;
            --border-gray: #e2e8f0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--pearl-green);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #cbd5e0;
        }
        .btn-remove {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 0.5rem;
        }
        .btn-remove:hover {
            background-color: #fee2e2;
        }
        .summary-value {
            font-weight: 500;
            color: #1a202c;
        }
        .summary-total-final {
            color: var(--pearl-dark-green);
        }
        .summary-item-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
            padding-top: 0;
            padding-bottom: 0;
        }
        .summary-item-details.open {
            max-height: 200px; /* Adjust as needed */
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .summary-item-header {
            cursor: pointer;
        }
        .component-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .component-price {
            font-weight: 500;
            color: var(--pearl-dark-green);
        }
        .input-group {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
        .input-group.error {
            border-color: #ef4444; /* red-500 */
            box-shadow: 0 0 0 1px #ef4444;
        }
        .calculator-toggle {
            display: flex;
            border: 1px solid var(--pearl-green);
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .calculator-toggle button {
            padding: 0.5rem 1rem;
            border: none;
            background-color: white;
            color: var(--pearl-green);
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .calculator-toggle button.active {
            background-color: var(--pearl-green);
            color: white;
            cursor: default;
        }
        .calculator-toggle button:not(.active):hover {
            background-color: var(--pearl-light-green);
        }
        /* NEW: Styles for the second pair header */
        .second-pair-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom-width: 1px;
            padding-bottom: 0.5rem;
        }
    </style>
</head>
<body class="text-gray-800">

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" class="h-8" alt="Pearle Vision Logo" onerror="this.onerror=null;this.src='https://placehold.co/100x32/ffffff/000000?text=Logo';">
        </div>
        <div class="calculator-toggle">
            <button class="active" onclick="window.location.href='./calculator.html'">Glasses</button>
            <button onclick="window.location.href='./contacts.html'">Contacts</button>
        </div>
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-2 space-y-6">

                <!-- FIRST PAIR SECTIONS (EXISTING CODE) -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Customer Information</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="input-group space-y-2">
                            <label for="customer-name" class="block text-sm font-medium text-gray-700">Customer Name</label>
                            <input type="text" id="customer-name" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                        </div>
                        <div class="input-group space-y-2">
                            <label for="insurance-type-select" class="block text-sm font-medium text-gray-700">Insurance</label>
                            <select id="insurance-type-select" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                                <option>Other Insurance</option>
                                <option>VSP</option>
                                <option>Declining Balance</option>
                            </select>
                        </div>
                        <div id="declining-balance-inputs" class="md:col-span-2 grid grid-cols-2 gap-2 input-group" style="display: none;">
                            <div class="space-y-1">
                                <label for="global-allowance" class="block text-sm font-medium text-gray-700">Global Allowance</label>
                                <input type="text" inputmode="decimal" id="global-allowance" placeholder="Allowance" class="config-input dollar-format w-full border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                            <div class="space-y-1">
                                <label for="global-discount" class="block text-sm font-medium text-gray-700">Global Discount</label>
                                <input type="text" inputmode="decimal" id="global-discount" placeholder="Discount" class="config-input percent-format w-full border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Exams</h3>
                    <div id="exam-options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4"></div>
                </div>

                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">1st Pair Frame & Lens Configuration</h3>
                    <div id="frame-group" class="md:col-span-2 input-group space-y-2 mb-4">
                        <div class="component-label">
                            <label for="frame-retail-price" class="block font-medium text-gray-700">Frame Details</label>
                            <span id="price-frame" class="component-price"></span>
                        </div>
                        <div class="flex items-center space-x-2">
                           <input type="text" inputmode="decimal" id="frame-retail-price" placeholder="Price" class="config-input w-2/4 border-gray-300 rounded-md shadow-sm dollar-format">
                           <input type="text" inputmode="decimal" id="allowance-frame" placeholder="Allowance" class="config-input dollar-format w-1/4 border-gray-300 rounded-md shadow-sm text-sm">
                           <input type="text" inputmode="decimal" id="discount-frame" placeholder="Discount" class="config-input percent-format w-1/4 border-gray-300 rounded-md shadow-sm text-sm">
                        </div>
                    </div>
                    <div id="dynamic-options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4"></div>
                </div>

                <!-- NEW: Second Pair Section -->
                <div id="second-pair-container" class="bg-white p-6 rounded-lg shadow space-y-6" style="display: none;">
                    <div class="second-pair-header">
                        <h3 class="text-xl font-semibold">2nd Pair Configuration (Out of Pocket)</h3>
                        <button id="remove-second-pair-btn" class="btn btn-remove">Remove 2nd Pair</button>
                    </div>
                    
                    <div class="input-group space-y-2">
                         <label for="second-pair-lens-discount" class="block text-sm font-medium text-gray-700">Lens & Add-On Discount</label>
                         <input type="text" inputmode="decimal" id="second-pair-lens-discount" placeholder="Discount % for all lenses/add-ons" class="config-input percent-format w-full border-gray-300 rounded-md shadow-sm">
                    </div>

                    <div id="frame-group-2" class="md:col-span-2 input-group space-y-2 mb-4">
                        <div class="component-label">
                            <label for="frame-retail-price-2" class="block font-medium text-gray-700">2nd Pair Frame Price</label>
                            <span id="price-frame-2" class="component-price"></span>
                        </div>
                         <input type="text" inputmode="decimal" id="frame-retail-price-2" placeholder="Retail Price" class="config-input w-full border-gray-300 rounded-md shadow-sm dollar-format">
                    </div>
                    <div id="dynamic-options-grid-2" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4"></div>
                </div>
                <!-- END NEW -->

                <!-- MODIFIED: Button to Add Second Pair -->
                <div id="add-second-pair-button-container" class="flex justify-end">
                    <button id="add-second-pair-btn" class="btn btn-primary">Add Second Pair</button>
                </div>
                <!-- END MODIFIED -->
            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow sticky top-24">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Quote Summary</h3>
                    <div id="summary-items" class="space-y-1 text-sm">
                       <p class="text-gray-500">Your selections will appear here.</p>
                    </div>
                    <div class="border-t my-4"></div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Retail Total</span>
                            <span id="summary-retail" class="summary-value">$0.00</span>
                        </div>
                        <div class="border-b border-gray-200 pb-1">
                            <div class="summary-item-header flex justify-between items-center" onclick="toggleDetails('summary-ins-svgs-details')">
                                <span class="text-gray-600">Insurance Savings</span>
                                <span id="summary-ins-svgs" class="summary-value">$0.00</span>
                            </div>
                            <div id="summary-ins-svgs-details" class="summary-item-details bg-gray-50 rounded px-3 text-gray-600">
                            </div>
                        </div>
                    </div>
                    <div class="border-t my-4"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold">Final Cost</span>
                        <span id="summary-final-cost" class="text-2xl font-bold summary-total-final">$0.00</span>
                    </div>

                    <div class="mt-6 flex space-x-2">
                        <button id="reset-button" class="btn btn-secondary w-full">Reset</button>
                        <button id="save-quote-button" class="btn btn-primary w-full">Save Quote</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="error-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-2">Invalid Price Calculation</h3>
                <div class="mt-2 px-7 py-3">
                    <p id="error-modal-message" class="text-sm text-gray-500"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="close-error-modal-btn" class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-300">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>


<script type="module">
    import { supabase } from './supabase-client.js';

    let priceListData = [];
    let examListData = [];
    let selectedStore = null; 

    const optionsGrid = document.getElementById('dynamic-options-grid');
    const examOptionsGrid = document.getElementById('exam-options-grid');
    const summaryItemsEl = document.getElementById('summary-items');
    const logoutBtn = document.getElementById('logout-btn');
    let addonCounter = 0;
    // NEW: Counter for 2nd pair add-ons
    let addonCounter2 = 0;
    
    // --- AUTH & DATA FETCHING ---
    async function checkUser() {
        const storeData = sessionStorage.getItem('selectedStore');
        if (!storeData) {
            window.location.href = './select-store.html';
            return;
        }
        selectedStore = JSON.parse(storeData);

        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html';
        } else {
            const { data: profile, error } = await supabase
                .from('profiles')
                .select('full_name')
                .eq('id', user.id)
                .single();

            if (error) {
                console.error('Error fetching profile:', error);
                document.getElementById('user-display').textContent = `Welcome, ${user.email}`;
            } else {
                document.getElementById('user-display').textContent = `Welcome, ${profile.full_name || user.email}`;
            }
            fetchData();
        }
    }

    async function fetchData() {
        const componentsPromise = supabase.from('components').select('*').eq('is_active', true);
        const examsPromise = supabase.from('exams').select('*').eq('is_active', true);
        const [componentsResult, examsResult] = await Promise.all([componentsPromise, examsPromise]);

        if (componentsResult.error || examsResult.error) {
            const errorMsg = componentsResult.error?.message || examsResult.error?.message;
            console.error("Error fetching data:", errorMsg);
            showErrorModal("Could not load pricing data. Please contact support. Error: " + errorMsg);
            return;
        }
        
        priceListData = [{ "Item": "None", "Category": "All", "Retail": 0 }, ...componentsResult.data];
        examListData = [{ "exam_type": "None", "Category": "All", "price_retail": 0 }, ...examsResult.data];
        
        initializeCalculator();
    }

    logoutBtn.addEventListener('click', async () => {
        sessionStorage.removeItem('selectedStore');
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });

    // --- CALCULATOR LOGIC ---
    const categories = [
        { id: 'Rx', label: 'Rx' }, { id: 'Lens Type', label: 'Lens Design' }, { id: 'Material', label: 'Material' },
        { id: 'Coatings', label: 'Coatings' }, { id: 'Backside UV', label: 'Backside UV' }, { id: 'Edge Polish', label: 'Edge Polish' }, 
        { id: 'Color', label: 'Color' }, { id: "Custom Measurements", label: "Custom Measurements" }, { id: 'Blue Light', label: 'Blue Light Filter' },
        { id: 'Protection', label: '1Yr. Protection' }, { id: 'Add-Ons', label: 'Add-Ons' }
    ];
    
    const examCategories = [
        { id: 'eye-exam', label: 'Eye Exam', type: 'select' }, { id: 'contacts-exam', label: 'Contacts Exam', type: 'select' },
        { id: 'refraction', label: 'Refraction', type: 'checkbox' }, { id: 'retinal-fundus-photos', label: 'Retinal Fundus Photos', type: 'checkbox' }
    ];

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    const toId = (str) => str.replace(/[\s./]+/g, '-').toLowerCase();

    const onFocus = (event) => { event.target.value = event.target.value.replace(/[$,%]/g, ''); };
    const onBlur = (event) => {
        let value = event.target.value;
        if (value) {
            if (event.target.classList.contains('dollar-format')) event.target.value = `$${value}`;
            else if (event.target.classList.contains('percent-format')) event.target.value = `${value}%`;
        }
    };
    
    function showErrorModal(message) {
        document.getElementById('error-modal-message').textContent = message;
        document.getElementById('error-modal').classList.remove('hidden');
    }
    
    function buildExamInputs() {
        examOptionsGrid.innerHTML = '';
        examCategories.forEach(cat => {
            const container = document.createElement('div');
            container.id = `container-${cat.id}`;
            container.className = 'input-group space-y-2';
            if (cat.type === 'select') {
                const options = examListData.filter(e => e.Category === cat.label && e.exam_type !== 'None');
                const allOptions = [examListData.find(e => e.exam_type === 'None'), ...options];
                container.innerHTML = `<div class="component-label"><label for="select-${cat.id}" class="font-medium text-gray-700">${cat.label}</label><span id="price-${cat.id}" class="component-price"></span></div><select id="select-${cat.id}" data-category="${cat.label}" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">${allOptions.map(o => o && `<option value="${o.exam_type}">${o.exam_type}</option>`).join('')}</select>`;
            } else {
                const singleOption = examListData.find(e => e.Category === cat.label);
                if (!singleOption) return;
                container.innerHTML = `<div class="component-label"><label class="flex items-center cursor-pointer"><input type="checkbox" id="checkbox-${cat.id}" data-item-name="${singleOption.exam_type}" class="config-option h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500"><span class="ml-2 font-medium text-gray-700">${cat.label}</span></label><span id="price-${cat.id}" class="component-price"></span></div>`;
            }
            container.innerHTML += `<div class="flex space-x-1"><input type="text" inputmode="decimal" id="allowance-${cat.id}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"><input type="text" inputmode="decimal" id="discount-${cat.id}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"><input type="text" inputmode="decimal" id="copay-${cat.id}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"></div>`;
            examOptionsGrid.appendChild(container);
        });
        const eyeExamSelect = document.getElementById('select-eye-exam');
        const refractionCheckbox = document.getElementById('checkbox-refraction');
        if (eyeExamSelect && refractionCheckbox) {
            eyeExamSelect.addEventListener('change', () => {
                if (eyeExamSelect.value !== 'None') refractionCheckbox.checked = true;
                updateCalculations();
            });
        }
    }

    // MODIFIED: Parameterized buildInputs to handle both pairs
    function buildInputs(targetGrid, idSuffix = '') {
        const gridElement = document.getElementById(targetGrid);
        if (!gridElement) return;
        gridElement.innerHTML = '';

        categories.forEach(cat => {
            const catId = toId(cat.id);
            const container = document.createElement('div');
            container.id = `container-${catId}${idSuffix}`;

            if (cat.id === 'Add-Ons') {
                container.className = 'md:col-span-2 space-y-2';
                container.innerHTML = `<h4 class="font-medium text-gray-700">${cat.label}</h4><div id="addons-repeater-container${idSuffix}" class="space-y-3"></div><button id="add-addon-btn${idSuffix}" type="button" class="btn btn-primary text-sm px-3 py-1">+ Add Add-On</button>`;
            } else {
                container.className = 'input-group space-y-2';
                const options = priceListData.filter(p => p.Category === cat.id && !p.Item.toLowerCase().startsWith('no ') && p.Item !== 'None');
                const useCheckbox = options.length <= 1 && !['Rx', 'Coatings', 'Color', 'Material', 'Lens Type'].includes(cat.id);
                
                if (useCheckbox) {
                    const singleOption = options[0] || { Item: cat.label };
                    const isCheckedDefault = (cat.id === 'Edge Polish') ? 'checked' : ''; 
                    container.innerHTML = `<div class="component-label"><label class="flex items-center cursor-pointer"><input type="checkbox" id="checkbox-${catId}${idSuffix}" data-item-name="${singleOption.Item}" ${isCheckedDefault} class="config-option h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500"><span class="ml-2 font-medium text-gray-700">${cat.label}</span></label><span id="price-${catId}${idSuffix}" class="component-price"></span></div>`;
                } else {
                    const allOptions = [priceListData.find(p => p.Item === 'None'), ...options];
                    container.innerHTML = `<div class="component-label"><label for="select-${catId}${idSuffix}" class="font-medium text-gray-700">${cat.label}</label><span id="price-${catId}${idSuffix}" class="component-price"></span></div><select id="select-${catId}${idSuffix}" data-category="${cat.id}" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">${allOptions.map(o => o && `<option value="${o.Item}">${o.Item}</option>`).join('')}</select>`;
                }
                
                // Only add insurance inputs for the first pair
                if (idSuffix === '') {
                    container.innerHTML += `<div class="flex space-x-1"><input type="text" inputmode="decimal" id="allowance-${catId}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"><input type="text" inputmode="decimal" id="discount-${catId}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"><input type="text" inputmode="decimal" id="copay-${catId}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"></div>`;
                }
            }
            gridElement.appendChild(container);
            
            if (cat.id === 'Add-Ons') {
                document.getElementById(`add-addon-btn${idSuffix}`).addEventListener('click', () => addAddonRow(idSuffix));
            }
        });

        if (idSuffix === '') {
            const vspCopayContainer = document.createElement('div');
            vspCopayContainer.id = 'container-material-co-pay';
            vspCopayContainer.className = 'input-group space-y-2'; 
            vspCopayContainer.style.display = 'none';
            vspCopayContainer.innerHTML = `<div class="component-label"><label class="font-medium text-gray-700">VSP Material Co-Pay</label><span id="price-material-co-pay" class="component-price"></span></div><div class="flex"><input type="text" inputmode="decimal" id="copay-material-co-pay" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1"></div>`;
            gridElement.appendChild(vspCopayContainer);
        }
    }

    // MODIFIED: Parameterized addAddonRow
    function addAddonRow(idSuffix = '') {
        let counter = (idSuffix === '-2') ? ++addonCounter2 : ++addonCounter;
        const repeaterContainer = document.getElementById(`addons-repeater-container${idSuffix}`);
        const addonRow = document.createElement('div');
        addonRow.id = `addon-row-${counter}${idSuffix}`;
        addonRow.className = 'addon-row input-group space-y-2';
        const allAddonItems = priceListData.filter(p => p.Category === 'Add-Ons');
        const optionsHTML = allAddonItems.map(o => `<option value="${o.Item}">${o.Item}</option>`).join('');

    // MODIFIED: Parameterized updateAddonDropdowns
    function updateAddonDropdowns(idSuffix = '') {
        const allAddonItems = priceListData.filter(p => p.Category === 'Add-Ons' && p.Item !== 'No Extras');
        const selectedAddons = Array.from(document.querySelectorAll(`#addons-repeater-container${idSuffix} .addon-select`)).map(select => select.value);
        document.querySelectorAll(`#addons-repeater-container${idSuffix} .addon-select`).forEach(select => {
            const currentValue = select.value;
            let optionsHTML = '<option value="No Extras">No Extras</option>';
            allAddonItems.forEach(item => {
                if (item.Item === currentValue || !selectedAddons.includes(item.Item)) {
                    optionsHTML += `<option value="${item.Item}">${item.Item}</option>`;
                }
            });
            select.innerHTML = optionsHTML;
            select.value = currentValue;
        });
        const addButton = document.getElementById(`add-addon-btn${idSuffix}`);
        if(addButton) {
            const availableAddons = allAddonItems.length - selectedAddons.filter(item => item !== 'No Extras').length;
            addButton.disabled = availableAddons <= 0;
        }
    }

    function attachEventListeners() {
        document.querySelectorAll('.config-option, .config-input').forEach(el => {
            el.removeEventListener('input', updateCalculations);
            el.addEventListener('input', updateCalculations);
            if (el.classList.contains('dollar-format') || el.classList.contains('percent-format')) {
                el.removeEventListener('focus', onFocus);
                el.removeEventListener('blur', onBlur);
                el.addEventListener('focus', onFocus);
                el.addEventListener('blur', onBlur);
            }
        });
        document.querySelectorAll('.btn-remove').forEach(button => {
            button.removeEventListener('click', removeAddonRowHandler);
            button.addEventListener('click', removeAddonRowHandler);
        });
        document.querySelectorAll('.addon-select').forEach(select => {
            const idSuffix = select.id.includes('-2') ? '-2' : '';
            select.removeEventListener('change', () => updateAddonDropdowns(idSuffix));
            select.addEventListener('change', () => updateAddonDropdowns(idSuffix));
        });
    }

    function removeAddonRowHandler(event) {
        const rowId = event.currentTarget.dataset.rowId;
        const idSuffix = rowId.includes('-2') ? '-2' : '';
        document.getElementById(`addon-row-${rowId}`).remove();
        updateAddonDropdowns(idSuffix);
        updateCalculations();
    }

    function getCleanValue(elementId) {
        const el = document.getElementById(elementId);
        return (el && el.value) ? (parseFloat(el.value.replace(/[$,%]/g, '')) || 0) : 0;

    function calculateItem(retail, insAllow, discount, copay, isFrame = false) {
        let finalCost, insSvgs;
        if (insAllow === 0 && discount === 0 && copay > 0) {
            finalCost = copay;
            insSvgs = retail - finalCost;
        } else { 
            let yourCost = isFrame ? (retail - insAllow) * (1 - (discount / 100)) : retail * (1 - (discount / 100)) - insAllow;
            yourCost = Math.max(0, yourCost);
            finalCost = yourCost + copay;
            insSvgs = retail - finalCost;
        }
        return { finalCost, insSvgs, isError: retail > 0 && finalCost > retail };
    }

    // MODIFIED: Major rewrite of updateCalculations

        let errorFound = false;
        const insuranceType = document.getElementById('insurance-type-select').value;

        const coatingsSelect = document.getElementById('select-coatings');

        if (coatingsSelect && backsideUVCheckbox && coatingsSelect.value === 'Premium Plus A.R.') {
            backsideUVCheckbox.checked = true;
        }

        // Auto-select logic for 2nd pair
        const rxSelect2 = document.getElementById('select-rx-2');
        const lensTypeSelect2 = document.getElementById('select-lens-type-2');

            else if (rxValue2.includes('BiFocal')) targetLensType2 = 'BiFocal Digital Aspheric';
            else if (rxValue2.startsWith('PG')) targetLensType2 = 'Prog. Digital Aspheric';
            const optionExists2 = Array.from(lensTypeSelect2.options).some(o => o.value === targetLensType2);
            if (optionExists2) {
                lensTypeSelect2.value = targetLensType2;
                lensTypeSelect2.disabled = (targetLensType2 !== 'None');
            } else {
                lensTypeSelect2.value = 'None';
                lensTypeSelect2.disabled = false;
            }
        }
        const coatingsSelect2 = document.getElementById('select-coatings-2');
        const backsideUVCheckbox2 = document.getElementById('checkbox-backside-uv-2');
        if (coatingsSelect2 && backsideUVCheckbox2 && coatingsSelect2.value === 'Premium Plus A.R.') {
            backsideUVCheckbox2.checked = true;
        }


        // Handle UI visibility based on insurance type
        document.getElementById('declining-balance-inputs').style.display = isDecliningBalance ? 'grid' : 'none';
        document.querySelectorAll('#frame-group [id^="allowance-"], #frame-group [id^="discount-"], #dynamic-options-grid [id^="allowance-"], #dynamic-options-grid [id^="discount-"], #dynamic-options-grid [id^="copay-"]').forEach(input => {

        // --- Process Exam Items ---
        let examRetailTotal = 0;
        examCategories.forEach(cat => {
            const catId = cat.id;
            const priceEl = document.getElementById(`price-${catId}`);
            let selectedValue = document.getElementById(`checkbox-${catId}`)?.checked ? document.getElementById(`checkbox-${catId}`).dataset.itemName : document.getElementById(`select-${cat.id}`)?.value;
            if (!selectedValue || selectedValue === "None") { if(priceEl) priceEl.textContent = ''; return; }
            const selectedItem = examListData.find(p => p.exam_type === selectedValue);

            const inputs = { retail: selectedItem.price_retail, insAllow: getCleanValue(`allowance-${catId}`), discount: getCleanValue(`discount-${catId}`), copay: getCleanValue(`copay-${catId}`) };

            totalRetail += inputs.retail;
            examRetailTotal += inputs.retail;
            totalInsSvgs += calc.insSvgs;
            totalFinalCost += calc.finalCost;
            summaryContent += createSummaryItemHTML(cat.label, inputs, calc, isDecliningBalance, true);
            if (priceEl) priceEl.textContent = formatCurrency(calc.finalCost);
        });

        // --- Process 1st Pair ---
        let firstPairLensRetail = 0;
        const frameRetail = getCleanValue('frame-retail-price');
        if (frameRetail > 0) {
            const inputs = { retail: frameRetail, insAllow: isDecliningBalance ? 0 : getCleanValue('allowance-frame'), discount: isDecliningBalance ? 0 : getCleanValue('discount-frame'), copay: 0 };
            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay, true);
            if (calc.isError && !errorFound) { errorFound = true; showErrorModal("The final price for the Frame cannot exceed its retail price."); document.getElementById('frame-group').classList.add('error'); }
            totalRetail += inputs.retail;
            if (!isDecliningBalance) { totalInsSvgs += calc.insSvgs; totalFinalCost += calc.finalCost; }
            summaryContent += createSummaryItemHTML('1st Pair Frame', inputs, calc, isDecliningBalance, false);
            document.getElementById('price-frame').textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        } else { document.getElementById('price-frame').textContent = ''; }

        categories.forEach(cat => {
            const catId = toId(cat.id);
            const priceEl = document.getElementById(`price-${catId}`);
            let selectedValue = document.getElementById(`checkbox-${catId}`)?.checked ? document.getElementById(`checkbox-${catId}`).dataset.itemName : document.getElementById(`select-${catId}`)?.value;
            if (!selectedValue || selectedValue === "None" || cat.id === "Add-Ons") { if(priceEl) priceEl.textContent = ''; return; }
            const selectedItem = priceListData.find(p => p.Item === selectedValue);
            if (!selectedItem) return;
            const inputs = { retail: selectedItem.Retail, insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-${catId}`), discount: isDecliningBalance ? 0 : getCleanValue(`discount-${catId}`), copay: isDecliningBalance ? 0 : getCleanValue(`copay-${catId}`) };
            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) { errorFound = true; showErrorModal(`The final price for ${cat.label} cannot exceed its retail price.`); document.getElementById(`container-${catId}`).classList.add('error'); }
            firstPairLensRetail += inputs.retail;
            if (!isDecliningBalance) { totalInsSvgs += calc.insSvgs; totalFinalCost += calc.finalCost; }
            summaryContent += createSummaryItemHTML(`1st Pair ${cat.label}`, inputs, calc, isDecliningBalance, false);
            if (priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });

        document.querySelectorAll('#addons-repeater-container .addon-row').forEach(row => {
            const rowIdNum = row.id.match(/\d+/)[0];

            const selectedItem = priceListData.find(p => p.Item === itemName);
            if (!selectedItem) return;
            const inputs = { retail: selectedItem.Retail, insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-addon-${rowIdNum}`), discount: isDecliningBalance ? 0 : getCleanValue(`discount-addon-${rowIdNum}`), copay: isDecliningBalance ? 0 : getCleanValue(`copay-addon-${rowIdNum}`) };
            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) { errorFound = true; showErrorModal(`The final price for ${itemName} cannot exceed its retail price.`); row.classList.add('error'); }
            firstPairLensRetail += inputs.retail;
            if (!isDecliningBalance) { totalInsSvgs += calc.insSvgs; totalFinalCost += calc.finalCost; }
            summaryContent += createSummaryItemHTML(`1st Pair ${itemName}`, inputs, calc, isDecliningBalance, false);
            if(priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });
        totalRetail += firstPairLensRetail;

        // --- Process 2nd Pair (if visible) ---
        if (document.getElementById('second-pair-container').style.display !== 'none') {
            let secondPairLensRetail = 0;
            const secondPairFrameRetail = getCleanValue('frame-retail-price-2');
            if (secondPairFrameRetail > 0) {
                totalRetail += secondPairFrameRetail;
                totalFinalCost += secondPairFrameRetail;
                summaryContent += createSummaryItemHTML('2nd Pair Frame', { retail: secondPairFrameRetail, discount: 0, insAllow: 0, copay: 0 }, { finalCost: secondPairFrameRetail }, true, false);

                secondPairLensRetail += selectedItem.Retail;
                if (priceEl) priceEl.textContent = formatCurrency(selectedItem.Retail);

            document.querySelectorAll('#addons-repeater-container-2 .addon-row').forEach(row => {

    function createSummaryItemHTML(title, inputs, outputs, isSecondPairOrDB, isExam) {
        const id = toId(title);
        let discountCalcAmount = (id.includes('frame') && !isSecondPairOrDB) ? (inputs.retail - inputs.insAllow) * (inputs.discount / 100) : inputs.retail * (inputs.discount / 100);
        let copayHTML = inputs.copay > 0 ? `<div class="flex justify-between text-xs pt-1"><span>Co-Pay</span><span>+${formatCurrency(inputs.copay)}</span></div>` : '';
        const showBreakdown = !isSecondPairOrDB || isExam;
        const finalCost = (isSecondPairOrDB && !isExam) ? inputs.retail : outputs.finalCost;
        
        return `<div class="border-b border-gray-200 pb-1"><div class="summary-item-header flex justify-between items-center" onclick="toggleDetails('details-${id}')"><span class="font-medium">${title}</span><span class="font-semibold">${formatCurrency(finalCost)}</span></div><div id="details-${id}" class="summary-item-details bg-gray-50 rounded px-3 text-gray-600"><div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Retail</span><span>${formatCurrency(inputs.retail)}</span></div>${showBreakdown ? `<div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Ins. Allowance</span><span>-${formatCurrency(inputs.insAllow)}</span></div><div class="flex justify-between text-xs ${inputs.copay > 0 ? 'border-b border-gray-200 py-1' : 'pt-1'}"><span>Discount (${inputs.discount}%)</span><span>-${formatCurrency(discountCalcAmount)}</span></div>${copayHTML}` : ''}</div></div>`;
    }

        document.getElementById('remove-second-pair-btn').addEventListener('click', () => {
            document.getElementById('second-pair-container').style.display = 'none';
            document.getElementById('add-second-pair-button-container').style.display = 'flex';
            // Clear second pair inputs
            document.querySelectorAll('#second-pair-container input, #second-pair-container select').forEach(el => {
                if (el.type === 'checkbox') el.checked = false;
                else if (el.tagName === 'SELECT') el.selectedIndex = 0;
                else el.value = '';
            });
            document.getElementById('addons-repeater-container-2').innerHTML = '';
            addonCounter2 = 0;
            updateCalculations();
        });

        attachEventListeners();
        updateCalculations();
    }

    // --- INITIALIZATION ---
    checkUser();
</script>
</body>
