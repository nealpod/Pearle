<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pearle Vision - Price Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pearl-green: #007a33;
            --pearl-dark-green: #005c24;
            --pearl-light-green: #e6f2e9;
            --light-gray: #f8f9fa;
            --border-gray: #e2e8f0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--light-gray);
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .btn-primary {
            background-color: var(--pearl-green);
            color: white;
        }
        .btn-primary:hover {
            background-color: var(--pearl-dark-green);
        }
        .btn-primary:disabled {
            background-color: #a0aec0;
            cursor: not-allowed;
        }
        .btn-secondary {
            background-color: #e2e8f0;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #cbd5e0;
        }
        .btn-remove {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 0.5rem;
        }
        .btn-remove:hover {
            background-color: #fee2e2;
        }
        .summary-value {
            font-weight: 500;
            color: #1a202c;
        }
        .summary-total-final {
            color: var(--pearl-dark-green);
        }
        .summary-item-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-in-out, padding 0.3s ease-in-out;
            padding-top: 0;
            padding-bottom: 0;
        }
        .summary-item-details.open {
            max-height: 200px; /* Adjust as needed */
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
        }
        .summary-item-header {
            cursor: pointer;
        }
        .component-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .component-price {
            font-weight: 500;
            color: var(--pearl-dark-green);
        }
        .input-group {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }
        .input-group.error {
            border-color: #ef4444; /* red-500 */
            box-shadow: 0 0 0 1px #ef4444;
        }
        /* Style for the Glasses/Contacts toggle button */
        .calculator-toggle {
            display: flex;
            border: 1px solid var(--pearl-green);
            border-radius: 0.375rem;
            overflow: hidden;
        }
        .calculator-toggle button {
            padding: 0.5rem 1rem;
            border: none;
            background-color: white;
            color: var(--pearl-green);
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .calculator-toggle button.active {
            background-color: var(--pearl-green);
            color: white;
            cursor: default;
        }
        .calculator-toggle button:not(.active):hover {
            background-color: var(--pearl-light-green);
        }
    </style>
</head>
<body>

    <header class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-20">
        <div>
            <img src="https://1000logos.net/wp-content/uploads/2021/04/Pearle-Vision-logo.png" class="h-8">
        </div>

        <!-- Calculator Toggle Button -->
        <div class="calculator-toggle">
            <button class="active" onclick="window.location.href='./calculator.html'">Glasses</button>
            <button onclick="window.location.href='./contacts.html'">Contacts</button>
        </div>
        
        <div class="flex items-center space-x-4">
            <span id="user-display" class="text-sm font-medium"></span>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-900">Log Out</button>
        </div>
    </header>

    <main class="p-4 sm:p-6 lg:p-8">
        <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-2 space-y-6">

                <!-- Patient & Insurance & Eye Exam Section -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Patient & Insurance & Eye Exam</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="input-group space-y-2">
                            <label for="customer-name" class="block text-sm font-medium text-gray-700">Customer Name</label>
                            <input type="text" id="customer-name" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                        </div>
                        <div class="input-group space-y-2">
                            <label for="insurance-type-select" class="block text-sm font-medium text-gray-700">Insurance</label>
                            <select id="insurance-type-select" class="block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                                <option>Other Insurance</option>
                                <option>VSP</option>
                                <option>Declining Balance</option>
                            </select>
                        </div>
                        <!-- Global Allowance/Discount Fields (for Declining Balance) -->
                        <div id="declining-balance-inputs" class="md:col-span-2 grid grid-cols-2 gap-2 input-group" style="display: none;">
                            <div class="space-y-1">
                                <label for="global-allowance" class="block text-sm font-medium text-gray-700">Global Allowance</label>
                                <input type="text" inputmode="decimal" id="global-allowance" placeholder="Allowance" class="config-input dollar-format w-full border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                            <div class="space-y-1">
                                <label for="global-discount" class="block text-sm font-medium text-gray-700">Global Discount</label>
                                <input type="text" inputmode="decimal" id="global-discount" placeholder="Discount" class="config-input percent-format w-full border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                        </div>

                        <!-- Eye Exam Details Section -->
                        <div class="md:col-span-2 space-y-4">
                            <h4 class="font-medium text-gray-700 border-t pt-4">Eye Exam Details</h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                                <!-- Eye Exam Type (Mandatory) -->
                                <div class="input-group space-y-2">
                                    <div class="component-label">
                                        <label for="select-eye-exam-type" class="font-medium text-gray-700">Eye Exam Type</label>
                                        <span id="price-eye-exam-type" class="component-price"></span>
                                    </div>
                                    <select id="select-eye-exam-type" data-category="Eye Exam Type" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                                        <option value="None">Select Eye Exam</option>
                                        <!-- Options populated dynamically from Supabase (e.g., "New Patient Comprehensive Eye Exam", "Existing Patient Comprehensive Eye Exam") -->
                                    </select>
                                    <div class="flex space-x-1">
                                        <input type="text" inputmode="decimal" id="allowance-eye-exam-type" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                        <input type="text" inputmode="decimal" id="discount-eye-exam-type" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                        <input type="text" inputmode="decimal" id="copay-eye-exam-type" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                    </div>
                                </div>

                                <!-- Contact Lens Exam (Optional) -->
                                <div class="input-group space-y-2">
                                    <div class="component-label">
                                        <label for="select-contact-lens-exam" class="font-medium text-gray-700">Contact Lens Exam</label>
                                        <span id="price-contact-lens-exam" class="component-price"></span>
                                    </div>
                                    <select id="select-contact-lens-exam" data-category="Contact Lens Exam" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                                        <option value="None">None</option>
                                        <!-- Options populated dynamically from Supabase -->
                                    </select>
                                    <div class="flex space-x-1">
                                        <input type="text" inputmode="decimal" id="allowance-contact-lens-exam" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                        <input type="text" inputmode="decimal" id="discount-contact-lens-exam" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                        <input type="text" inputmode="decimal" id="copay-contact-lens-exam" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                    </div>
                                </div>

                                <!-- Retinal Fundus Photos (Optional Checkbox) -->
                                <div class="input-group space-y-2">
                                    <div class="component-label">
                                        <label class="flex items-center cursor-pointer">
                                            <input type="checkbox" id="checkbox-retinal-fundus-photos" data-item-name="Retinal Fundus Photos" class="config-option h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                                            <span class="ml-2 font-medium text-gray-700">Retinal Fundus Photos</span>
                                        </label>
                                        <span id="price-retinal-fundus-photos" class="component-price"></span>
                                    </div>
                                    <div class="flex space-x-1">
                                        <input type="text" inputmode="decimal" id="allowance-retinal-fundus-photos" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                        <input type="text" inputmode="decimal" id="discount-retinal-fundus-photos" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                        <input type="text" inputmode="decimal" id="copay-retinal-fundus-photos" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Frame and Lens Configuration Section (Renamed and Frame Details moved here) -->
                <div class="bg-white p-6 rounded-lg shadow">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Frame and Lens Configuration</h3>
                    <div id="frame-lens-dynamic-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                        <!-- Frame Details (Moved from above) -->
                        <div id="frame-group" class="md:col-span-2 input-group space-y-2">
                            <div class="component-label">
                                <label for="frame-retail-price" class="block font-medium text-gray-700">Frame Details</label>
                                <span id="price-frame" class="component-price"></span>
                            </div>
                            <div class="flex items-center space-x-2">
                               <input type="text" inputmode="decimal" id="frame-retail-price" placeholder="Price" class="config-input w-2/4 border-gray-300 rounded-md shadow-sm dollar-format">
                               <input type="text" inputmode="decimal" id="allowance-frame" placeholder="Allowance" class="config-input dollar-format w-1/4 border-gray-300 rounded-md shadow-sm text-sm">
                               <input type="text" inputmode="decimal" id="discount-frame" placeholder="Discount" class="config-input percent-format w-1/4 border-gray-300 rounded-md shadow-sm text-sm">
                            </div>
                        </div>
                        <!-- Dynamic options for Rx, Lens Type, Material, etc. will be built here by JS -->
                        <div id="dynamic-options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4"></div>
                    </div>
                </div>

            </div>

            <div class="lg:col-span-1">
                <div class="bg-white p-6 rounded-lg shadow sticky top-24">
                    <h3 class="text-xl font-semibold mb-4 border-b pb-2">Quote Summary</h3>
                    <div id="summary-items" class="space-y-1 text-sm">
                       <p class="text-gray-500">Your selections will appear here.</p>
                    </div>
                    <div class="border-t my-4"></div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Retail Total</span>
                            <span id="summary-retail" class="summary-value">$0.00</span>
                        </div>
                        <!-- MODIFIED: Insurance Savings block to include details -->
                        <div class="border-b border-gray-200 pb-1">
                            <div class="summary-item-header flex justify-between items-center" onclick="toggleDetails('summary-ins-svgs-details')">
                                <span class="text-gray-600">Insurance Savings</span>
                                <span id="summary-ins-svgs" class="summary-value">$0.00</span>
                            </div>
                            <div id="summary-ins-svgs-details" class="summary-item-details bg-gray-50 rounded px-3 text-gray-600">
                                <!-- Content for breakdown will be injected here by JS -->
                            </div>
                        </div>
                    </div>
                    <div class="border-t my-4"></div>
                    <div class="flex justify-between items-center">
                        <span class="text-lg font-bold">Final Cost</span>
                        <span id="summary-final-cost" class="text-2xl font-bold summary-total-final">$0.00</span>
                    </div>

                    <div class="mt-6 flex space-x-2">
                        <button id="reset-button" class="btn btn-secondary w-full">Reset</button>
                        <button id="save-quote-button" class="btn btn-primary w-full">Save Quote</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="error-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden z-50">
        <div class="relative top-20 mx-auto p-5 border w-full max-w-md shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <svg class="h-6 w-6 text-red-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-2">Invalid Price Calculation</h3>
                <div class="mt-2 px-7 py-3">
                    <p id="error-modal-message" class="text-sm text-gray-500"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button id="close-error-modal-btn" class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-300">
                        OK
                    </button>
                </div>
            </div>
        </div>
    </div>


<script type="module">
    import { supabase } from './supabase-client.js';

    // This will be populated from Supabase
    let priceListData = [];

    // Corrected variable names for clarity and proper element targeting
    const mainLensOptionsGrid = document.getElementById('dynamic-options-grid'); // This is the inner grid for lens/addon options
    const summaryItemsEl = document.getElementById('summary-items');
    const logoutBtn = document.getElementById('logout-btn');
    let addonCounter = 0;
    
    // --- AUTH & DATA FETCHING ---

    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
            window.location.href = './index.html'; // Redirect to login if not authenticated
        } else {
            // Display user's email or a friendly message
            document.getElementById('user-display').textContent = `Welcome, ${user.email}`;
            // Fetch pricing data only after user is confirmed authenticated
            fetchData(); 
        }
    }

    async function fetchData() {
        // Fetch active components from the 'components' table
        const { data: componentsData, error: componentsError } = await supabase
            .from('components')
            .select('*')
            .eq('is_active', true);

        // Fetch active exams from the new 'exams' table
        const { data: examsData, error: examsError } = await supabase
            .from('exams')
            .select('exam_type, price_retail, price_eyemed, price_vsp, is_active') // Assuming is_active column exists in exams
            .eq('is_active', true); // Filter for active exams

        if (componentsError) {
            console.error("Error fetching components data:", componentsError);
            showErrorModal("Could not load components pricing data. Please contact support. Error: " + componentsError.message);
            return;
        }
        if (examsError) {
            console.error("Error fetching exams data:", examsError);
            showErrorModal("Could not load exams pricing data. Please contact support. Error: " + examsError.message);
            return;
        }
        
        // Map exams data to match priceListData structure for consistency
        const mappedExamsData = examsData.map(exam => {
            let category;
            // Categorize exam types for use in the calculator's buildInputs and updateCalculations
            if (exam.exam_type.includes('Comprehensive Eye Exam')) category = 'Eye Exam Type';
            else if (exam.exam_type.includes('Contact Lens Exam')) category = 'Contact Lens Exam';
            else if (exam.exam_type === 'Retinal Fundus Photos') category = 'Retinal Fundus Photos';
            else if (exam.exam_type === 'Refraction Charge') category = 'Refraction'; 
            else category = 'Exams Other'; // Fallback for any other exam types

            return {
                Item: exam.exam_type,
                Category: category,
                Retail: exam.price_retail,
                price_eyemed: exam.price_eyemed || 0, 
                price_vsp: exam.price_vsp || 0,       
                is_active: exam.is_active 
            };
        });

        // Combine components and mapped exams data into a single priceListData
        priceListData = [{ "Item": "None", "Category": "All", "Retail": 0 }, ...componentsData, ...mappedExamsData];
        
        // Once data is loaded, build the UI
        initializeCalculator();
    }

    logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = './index.html';
    });


    // --- CALCULATOR LOGIC ---

    // Categories for Lens & Add-On Configuration (original order + Backside UV)
    const categories = [
        { id: 'Rx', label: 'Rx' },
        { id: 'Lens Type', label: 'Lens Design' }, 
        { id: 'Material', label: 'Material' },
        { id: 'Color', label: 'Color' }, 
        { id: 'Coatings', label: 'Coatings' },
        { id: 'Backside UV', label: 'Backside UV' },
        { id: 'Edge Polish', label: 'Edge Polish' }, 
        { id: "Custom Measurements", label: "Custom Measurements" },
        { id: 'Blue Light', label: 'Blue Light Filter' },
        { id: 'Protection', label: '1Yr. Protection' },
        { id: 'Add-Ons', label: 'Add-Ons' }
    ];

    const formatCurrency = (amount) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
    const toId = (str) => str.replace(/\s+/g, '-').toLowerCase();

    const onFocus = (event) => {
        let value = event.target.value;
        value = value.replace(/[$,%]/g, '');
        event.target.value = value;
    };

    const onBlur = (event) => {
        let value = event.target.value;
        if (value) {
            if (event.target.classList.contains('dollar-format')) event.target.value = `$${value}`;
            else if (event.target.classList.contains('percent-format')) event.target.value = `${value}%`;
        }
    };
    
    function showErrorModal(message) {
        const modal = document.getElementById('error-modal');
        const modalMessage = document.getElementById('error-modal-message');
        modalMessage.textContent = message;
        modal.classList.remove('hidden');
    }

    function buildInputs() {
        // Clear the main dynamic lens options grid
        mainLensOptionsGrid.innerHTML = ''; 

        // Populate the new Eye Exam Type dropdown first, as it's mandatory
        const eyeExamTypeSelect = document.getElementById('select-eye-exam-type');
        if (eyeExamTypeSelect) {
            const eyeExamOptions = priceListData.filter(p => p.Category === 'Eye Exam Type' && p.Item !== 'None');
            eyeExamTypeSelect.innerHTML = `<option value="None">Select Eye Exam</option>` + 
                                          eyeExamOptions.map(o => `<option value="${o.Item}">${o.Item}</option>`).join('');
        }
        
        // Populate Contact Lens Exam dropdown
        const contactLensExamSelect = document.getElementById('select-contact-lens-exam');
        if (contactLensExamSelect) {
            const contactLensOptions = priceListData.filter(p => p.Category === 'Contact Lens Exam' && p.Item !== 'None');
            contactLensExamSelect.innerHTML = `<option value="None">None</option>` +
                                              contactLensOptions.map(o => `<option value="${o.Item}">${o.Item}</option>`).join('');
        }

        // Now build the rest of the dynamic options (Rx, Lens Type, etc.)
        categories.forEach(cat => {
            // Skip 'Add-Ons' as it's handled separately below
            if (cat.id === 'Add-Ons') return; 
            
            const catId = toId(cat.id);
            const container = document.createElement('div');
            container.id = `container-${catId}`;

            container.className = 'input-group space-y-2';
            const options = priceListData.filter(p => p.Category === cat.id && !p.Item.toLowerCase().startsWith('no ') && p.Item !== 'None');

            // Logic for checkbox items (Edge Polish, Backside UV, Retinal Fundus Photos)
            if (['Edge Polish', 'Backside UV', 'Retinal Fundus Photos'].includes(cat.id)) {
                const singleOption = options[0] || { Item: cat.label }; 
                const isCheckedDefault = (cat.id === 'Edge Polish') ? 'checked' : ''; // Only Edge Polish is default checked on load/reset
                container.innerHTML = `
                    <div class="component-label">
                         <label class="flex items-center cursor-pointer">
                             <input type="checkbox" id="checkbox-${catId}" data-item-name="${singleOption.Item}" ${isCheckedDefault} class="config-option h-4 w-4 text-green-600 border-gray-300 rounded focus:ring-green-500">
                             <span class="ml-2 font-medium text-gray-700">${cat.label}</span>
                         </label>
                         <span id="price-${catId}" class="component-price"></span>
                    </div>
                    <div class="flex space-x-1">
                        <input type="text" inputmode="decimal" id="allowance-${catId}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                        <input type="text" inputmode="decimal" id="discount-${catId}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                        <input type="text" inputmode="decimal" id="copay-${catId}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                    </div>
                `;
            } 
            // Existing logic for dropdowns
            else {
                const allOptions = [priceListData.find(p => p.Item === 'None'), ...options];
                container.innerHTML = `
                    <div class="component-label">
                        <label for="select-${catId}" class="font-medium text-gray-700">${cat.label}</label>
                        <span id="price-${catId}" class="component-price"></span>
                    </div>
                    <select id="select-${catId}" data-category="${cat.id}" class="config-option block w-full border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500">
                        ${allOptions.map(o => o && `<option value="${o.Item}">${o.Item}</option>`).join('')}
                    </select>
                    <div class="flex space-x-1">
                        <input type="text" inputmode="decimal" id="allowance-${catId}" placeholder="Allowance" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                        <input type="text" inputmode="decimal" id="discount-${catId}" placeholder="Discount" class="config-input percent-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                        <input type="text" inputmode="decimal" id="copay-${catId}" placeholder="CoPay" class="config-input dollar-format w-1/3 border-gray-300 rounded-md shadow-sm text-xs p-1">
                    </div>
                `;

    function updateAddonDropdowns() {
        const allAddonItems = priceListData.filter(p => p.Category === 'Add-Ons' && p.Item !== 'No Extras');
        const selectedAddons = Array.from(document.querySelectorAll('.addon-select')).map(select => select.value);

        addButton.disabled = availableAddons <= 0;

    function attachEventListeners() {
        // Attach listeners to all relevant inputs including new global ones and exam inputs
        document.querySelectorAll('.config-option, .config-input, #customer-name, #insurance-type-select, #frame-retail-price, #allowance-frame, #discount-frame, #global-allowance, #global-discount, #select-eye-exam-type, #select-contact-lens-exam, #checkbox-retinal-fundus-photos, #allowance-eye-exam-type, #discount-eye-exam-type, #copay-eye-exam-type, #allowance-contact-lens-exam, #discount-contact-lens-exam, #copay-contact-lens-exam, #allowance-retinal-fundus-photos, #discount-retinal-fundus-photos, #copay-retinal-fundus-photos').forEach(el => {
            el.removeEventListener('input', updateCalculations);
            el.addEventListener('input', updateCalculations);
            if (el.classList.contains('dollar-format') || el.classList.contains('percent-format')) {
                el.removeEventListener('focus', onFocus);
                el.removeEventListener('blur', onBlur);
                el.addEventListener('focus', onFocus);
                el.addEventListener('blur', onBlur);
            }
        });

        document.querySelectorAll('.btn-remove').forEach(button => {
            button.removeEventListener('click', removeAddonRow);
            button.addEventListener('click', removeAddonRow);
        });

         document.querySelectorAll('.addon-select').forEach(select => {
            select.removeEventListener('change', updateAddonDropdowns);
            select.addEventListener('change', updateAddonDropdowns);
        });
    }

    function removeAddonRow(event) {
        const rowId = event.currentTarget.dataset.rowId;
        document.getElementById(`addon-row-${rowId}`).remove();
        updateAddonDropdowns();

    }


    function getCleanValue(elementId) {
        const el = document.getElementById(elementId);
        if (el && el.value) {
            return parseFloat(el.value.replace(/[$,%]/g, '')) || 0;
        }
        return 0;
    }

    function calculateItem(retail, insAllow, discount, copay, isFrame = false) {
        let finalCost, yourCost, insSvgs;

        if (insAllow === 0 && discount === 0 && copay > 0) {
            finalCost = copay;
            yourCost = 0; 
            insSvgs = retail - finalCost;
        } else { 
            if (isFrame) {
                 yourCost = (retail - insAllow) * (1 - (discount / 100));
            } else {
                 yourCost = retail * (1 - (discount / 100)) - insAllow;
            }
            yourCost = Math.max(0, yourCost);
            finalCost = yourCost + copay;
            insSvgs = retail - finalCost;
        }
        
        const isError = retail > 0 && finalCost > retail;
        return { yourCost, finalCost, insSvgs, isError };
    }


    function updateCalculations() {
        document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
        let errorFound = false;

        const insuranceType = document.getElementById('insurance-type-select').value;
        const isDecliningBalance = (insuranceType === 'Declining Balance');

        let totalRetail = 0; // Accumulates retail price of all selected items
        let totalInsSvgs = 0; // Accumulates insurance savings (individual components for VSP/Other)
        let totalFinalCost = 0; // Accumulates final cost (individual components for VSP/Other)

        // Ensure dropdowns are updated first based on insurance type
        updateRxDropdown(); 
        updateCoatingsDropdown();

        // Rx -> Lens Type auto-selection logic
        const rxSelect = document.getElementById('select-rx');
        const lensTypeSelect = document.getElementById('select-lens-type');
        if (rxSelect && lensTypeSelect) {
            const rxValue = rxSelect.value;
            let targetLensType = 'None';
            if (rxValue.includes('S.V.')) targetLensType = 'S.V. Digital Aspheric';
            else if (rxValue.includes('BiFocal')) targetLensType = 'BiFocal Digital Aspheric';
            else if (rxValue.startsWith('PG')) targetLensType = 'Prog. Digital Aspheric';
            
            const optionExists = Array.from(lensTypeSelect.options).some(option => option.value === targetLensType);

            if (optionExists) {
                lensTypeSelect.value = targetLensType;
                lensTypeSelect.disabled = (targetLensType !== 'None'); 
            } else {
                lensTypeSelect.value = 'None';
                lensTypeSelect.disabled = false; 
            }
        }

        // Logic for Backside UV auto-checking based on Coatings selection
        const coatingsSelect = document.getElementById('select-coatings');
        const backsideUVCheckbox = document.getElementById('checkbox-backside-uv');

        if (coatingsSelect && backsideUVCheckbox) {
            if (coatingsSelect.value === 'Premium Plus A.R.') {
                backsideUVCheckbox.checked = true;
            } else {
                backsideUVCheckbox.checked = false;
            }
        }

        // --- Handle visibility of global vs. individual inputs ---
        const decliningBalanceInputsContainer = document.getElementById('declining-balance-inputs');
        if (decliningBalanceInputsContainer) {
            decliningBalanceInputsContainer.style.display = isDecliningBalance ? 'grid' : 'none'; 
        }

        // Hide/show individual allowance/discount inputs for Frame Details
        const frameAllowanceInput = document.getElementById('allowance-frame');
        const frameDiscountInput = document.getElementById('discount-frame');
        if (frameAllowanceInput && frameDiscountInput) {
            frameAllowanceInput.style.display = isDecliningBalance ? 'none' : 'block';
            frameDiscountInput.style.display = isDecliningBalance ? 'none' : 'block';
            if (isDecliningBalance) {
                frameAllowanceInput.value = '';
                frameDiscountInput.value = '';
            }
        }

        // Hide VSP Material Co-Pay if Declining Balance is selected or if insurance is not VSP
        const vspCopayContainer = document.getElementById('container-material-co-pay');
        if (vspCopayContainer) {
            if (insuranceType === 'VSP' && !isDecliningBalance) { 
                vspCopayContainer.style.display = 'block';
            } else {
                vspCopayContainer.style.display = 'none';
                document.getElementById('copay-material-co-pay').value = ''; 
            }
        }


        summaryItemsEl.innerHTML = '<p class="text-gray-500 initial-text">Your selections will appear here.</p>'; 
        let summaryContent = '';

        // --- Accumulate Retail Total from ALL selected items first ---
        // This ensures totalRetail is correct before final insurance calculations

        // 1. Frame Details
        const frameRetail = getCleanValue('frame-retail-price');
        if (frameRetail > 0) {
            totalRetail += frameRetail;
        }

        // 2. Eye Exam Type (Mandatory)
        const eyeExamTypeSelect = document.getElementById('select-eye-exam-type');
        if (eyeExamTypeSelect && eyeExamTypeSelect.value !== 'None') {
            const selectedEyeExamItem = priceListData.find(p => p.Item === eyeExamTypeSelect.value && p.Category === 'Eye Exam Type');
            if (selectedEyeExamItem) {
                totalRetail += selectedEyeExamItem.Retail;
            }
            // Add Refraction Charge if Eye Exam is selected (its retail)
            const refractionItem = priceListData.find(p => p.Item === 'Refraction Charge' && p.Category === 'Refraction');
            if (refractionItem) {
                totalRetail += refractionItem.Retail;
            }
        }

        // 3. Contact Lens Exam (Optional)
        const contactLensExamSelect = document.getElementById('select-contact-lens-exam');
        if (contactLensExamSelect && contactLensExamSelect.value !== 'None') {
            const selectedCLExamItem = priceListData.find(p => p.Item === contactLensExamSelect.value && p.Category === 'Contact Lens Exam');
            if (selectedCLExamItem) {
                totalRetail += selectedCLExamItem.Retail;
            }
        }

        // 4. Retinal Fundus Photos (Optional Checkbox)
        const retinalFundusPhotosCheckbox = document.getElementById('checkbox-retinal-fundus-photos');
        if (retinalFundusPhotosCheckbox && retinalFundusPhotosCheckbox.checked) {
            const retinalItem = priceListData.find(p => p.Item === 'Retinal Fundus Photos' && p.Category === 'Retinal Fundus Photos');
            if (retinalItem) {
                totalRetail += retinalItem.Retail;
            }
        }

        // 5. Other Lens & Add-On Configuration categories (Rx, Lens Type, Material, etc.)
        categories.forEach(cat => {
            if (['Eye Exam Type', 'Contact Lens Exam', 'Retinal Fundus Photos', 'Add-Ons'].includes(cat.id)) return;
            if (cat.id === 'Protection' && insuranceType === 'VSP') return; 

            const catId = toId(cat.id);
            let selectedValue;
            const checkbox = document.getElementById(`checkbox-${catId}`);
            if (checkbox) {
                if(checkbox.checked) selectedValue = checkbox.dataset.itemName;
                else return; // If unchecked, don't add to totalRetail or summary
            } else {
                 const select = document.getElementById(`select-${catId}`);
                 if (select) selectedValue = select.value;
            }

            if (!selectedValue || selectedValue === "None") return; 
            
            const selectedItem = priceListData.find(p => p.Item === selectedValue);
            if (!selectedItem) return;

            totalRetail += selectedItem.Retail; // Accumulate retail
        });

        // 6. Add-On rows
        document.querySelectorAll('.addon-row').forEach(row => {
            const select = document.getElementById(`select-addon-${row.id.split('-').pop()}`);
            const itemName = select.value;
            if (itemName === 'No Extras') return;

            const selectedItem = priceListData.find(p => p.Item === itemName);
            if (!selectedItem) return;

            totalRetail += selectedItem.Retail; // Accumulate retail
        });


        // --- Now calculate final costs and savings based on insurance type and accumulated totalRetail ---

        if (isDecliningBalance) {
            const globalAllowance = getCleanValue('global-allowance');
            const globalDiscount = getCleanValue('global-discount');
            
            let subtotal = totalRetail - globalAllowance;
            totalFinalCost = subtotal * (1 - (globalDiscount / 100));
            totalFinalCost = Math.max(0, totalFinalCost); 

            totalInsSvgs = totalRetail - totalFinalCost; 

        } else { // Existing logic for Other Insurance and VSP
            // Recalculate totalFinalCost and totalInsSvgs based on individual components
            // This section needs to re-loop through selected items to apply individual calculations
            // and accumulate them into totalFinalCost and totalInsSvgs.

            // Reset for recalculation based on individual items
            totalFinalCost = 0;
            totalInsSvgs = 0;

            // Process Frame Details for VSP/Other
            const frameRetail = getCleanValue('frame-retail-price');
            if (frameRetail > 0) {
                const frameInsAllow = getCleanValue('allowance-frame');
                const frameDiscount = getCleanValue('discount-frame');
                const frameCalc = calculateItem(frameRetail, frameInsAllow, frameDiscount, 0, true);
                totalInsSvgs += frameCalc.insSvgs;
                totalFinalCost += frameCalc.finalCost;
            }

            // Process Eye Exam Type (Mandatory) for VSP/Other
            if (eyeExamTypeSelect && eyeExamTypeSelect.value !== 'None') {
                const selectedEyeExamItem = priceListData.find(p => p.Item === eyeExamTypeSelect.value && p.Category === 'Eye Exam Type');
                if (selectedEyeExamItem) {
                    let examAllowance = 0;
                    if (insuranceType === 'VSP' && selectedEyeExamItem.price_vsp) {
                        examAllowance = selectedEyeExamItem.price_vsp;
                    } else if (insuranceType === 'Other Insurance' && selectedEyeExamItem.price_eyemed) {
                        examAllowance = selectedEyeExamItem.price_eyemed;
                    }
                    const inputs = {
                        retail: selectedEyeExamItem.Retail,
                        insAllow: getCleanValue(`allowance-eye-exam-type`) || examAllowance,
                        discount: getCleanValue(`discount-eye-exam-type`),
                        copay: getCleanValue(`copay-eye-exam-type`),
                    };
                    const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                    totalInsSvgs += calc.insSvgs;
                    totalFinalCost += calc.finalCost;
                }
                // Add Refraction Charge if Eye Exam is selected
                const refractionItem = priceListData.find(p => p.Item === 'Refraction Charge' && p.Category === 'Refraction');
                if (refractionItem) {
                    const refractionInputs = { retail: refractionItem.Retail, insAllow: 0, discount: 0, copay: 0 };
                    const refractionCalc = calculateItem(refractionInputs.retail, refractionInputs.insAllow, refractionInputs.discount, refractionInputs.copay);
                    totalInsSvgs += refractionCalc.insSvgs;
                    totalFinalCost += refractionCalc.finalCost;
                }
            }

            // Process Contact Lens Exam (Optional) for VSP/Other
            if (contactLensExamSelect && contactLensExamSelect.value !== 'None') {
                const selectedCLExamItem = priceListData.find(p => p.Item === contactLensExamSelect.value && p.Category === 'Contact Lens Exam');
                if (selectedCLExamItem) {
                    const inputs = {
                        retail: selectedCLExamItem.Retail,
                        insAllow: getCleanValue(`allowance-contact-lens-exam`),
                        discount: getCleanValue(`discount-contact-lens-exam`),
                        copay: getCleanValue(`copay-contact-lens-exam`),
                    };
                    const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                    totalInsSvgs += calc.insSvgs;
                    totalFinalCost += calc.finalCost;
                }
            }

            // Process Retinal Fundus Photos (Optional Checkbox) for VSP/Other
            if (retinalFundusPhotosCheckbox && retinalFundusPhotosCheckbox.checked) {
                const retinalItem = priceListData.find(p => p.Item === 'Retinal Fundus Photos' && p.Category === 'Retinal Fundus Photos');
                if (retinalItem) {
                    const inputs = {
                        retail: retinalItem.Retail,
                        insAllow: getCleanValue(`allowance-retinal-fundus-photos`),
                        discount: getCleanValue(`discount-retinal-fundus-photos`),
                        copay: getCleanValue(`copay-retinal-fundus-photos`),
                    };
                    const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                    totalInsSvgs += calc.insSvgs;
                    totalFinalCost += calc.finalCost;
                }
            }

            // Process Lens & Add-On Configuration categories (excluding new exam items) for VSP/Other
            categories.forEach(cat => {
                if (['Eye Exam Type', 'Contact Lens Exam', 'Retinal Fundus Photos', 'Add-Ons'].includes(cat.id)) return;
                if (cat.id === 'Protection' && insuranceType === 'VSP') return; 

                const catId = toId(cat.id);
                let selectedValue;
                const checkbox = document.getElementById(`checkbox-${catId}`);
                if (checkbox) {
                    if(checkbox.checked) selectedValue = checkbox.dataset.itemName;
                    else return; 
                } else {
                     const select = document.getElementById(`select-${catId}`);
                     if (select) selectedValue = select.value;
                }

                if (!selectedValue || selectedValue === "None") return; 
                
                const selectedItem = priceListData.find(p => p.Item === selectedValue);
                if (!selectedItem) return;

                const inputs = {
                    retail: selectedItem.Retail,
                    insAllow: getCleanValue(`allowance-${catId}`),
                    discount: getCleanValue(`discount-${catId}`),
                    copay: getCleanValue(`copay-${catId}`),
                };
                const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                totalInsSvgs += calc.insSvgs;
                totalFinalCost += calc.finalCost;
            });

            // Process Add-On rows for VSP/Other
            document.querySelectorAll('.addon-row').forEach(row => {
                const select = document.getElementById(`select-addon-${row.id.split('-').pop()}`);
                const itemName = select.value;
                if (itemName === 'No Extras') return;

                const selectedItem = priceListData.find(p => p.Item === itemName);
                if (!selectedItem) return;

                const inputs = {
                    retail: selectedItem.Retail,
                    insAllow: getCleanValue(`allowance-addon-${row.id.split('-').pop()}`),
                    discount: getCleanValue(`discount-addon-${row.id.split('-').pop()}`),
                    copay: getCleanValue(`copay-addon-${row.id.split('-').pop()}`),
                };
                const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                totalInsSvgs += calc.insSvgs;
                totalFinalCost += calc.finalCost;
            });

            // VSP Material Co-Pay (only applies to VSP and not Declining Balance)
            const vspCopayValue = getCleanValue('copay-material-co-pay');
            if (insuranceType === 'VSP' && vspCopayValue > 0) {
                totalFinalCost += vspCopayValue; 
                // Note: vspCopayValue is already a copay, so no further savings calculation needed for it here.
            }
        }

        // --- Re-generate summary content based on final calculated totals ---
        summaryContent = ''; // Clear previous summaryContent to rebuild it correctly

        // 1. Frame Details
        if (frameRetail > 0) {
            const frameInsAllow = isDecliningBalance ? 0 : getCleanValue('allowance-frame');
            const frameDiscount = isDecliningBalance ? 0 : getCleanValue('discount-frame');
            const frameCalc = calculateItem(frameRetail, frameInsAllow, frameDiscount, 0, true);
            summaryContent += createSummaryItemHTML('frame', 'Frame', {retail: frameRetail, insAllow: frameInsAllow, discount: frameDiscount, copay: 0}, frameCalc);
            document.getElementById('price-frame').textContent = formatCurrency(isDecliningBalance ? frameRetail : frameCalc.finalCost);
        } else {
            document.getElementById('price-frame').textContent = '';
        }

        // 2. Eye Exam Type (Mandatory)
        if (eyeExamTypeSelect && eyeExamTypeSelect.value !== 'None') {
            const selectedEyeExamItem = priceListData.find(p => p.Item === eyeExamTypeSelect.value && p.Category === 'Eye Exam Type');
            if (selectedEyeExamItem) {
                let examAllowance = 0;
                if (insuranceType === 'VSP' && selectedEyeExamItem.price_vsp) {
                    examAllowance = selectedEyeExamItem.price_vsp;
                } else if (insuranceType === 'Other Insurance' && selectedEyeExamItem.price_eyemed) {
                    examAllowance = selectedEyeExamItem.price_eyemed;
                }
                const inputs = {
                    retail: selectedEyeExamItem.Retail,
                    insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-eye-exam-type`) || examAllowance,
                    discount: isDecliningBalance ? 0 : getCleanValue(`discount-eye-exam-type`),
                    copay: isDecliningBalance ? 0 : getCleanValue(`copay-eye-exam-type`),
                };
                const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                summaryContent += createSummaryItemHTML('eye-exam-type', selectedEyeExamItem.Item, inputs, calc);
                document.getElementById('price-eye-exam-type').textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);

                // Refraction Charge
                const refractionItem = priceListData.find(p => p.Item === 'Refraction Charge' && p.Category === 'Refraction');
                if (refractionItem) {
                    const refractionInputs = { retail: refractionItem.Retail, insAllow: 0, discount: 0, copay: 0 };
                    const refractionCalc = calculateItem(refractionInputs.retail, refractionInputs.insAllow, refractionInputs.discount, refractionInputs.copay);
                    summaryContent += createSummaryItemHTML('refraction-charge', 'Refraction Charge', refractionInputs, refractionCalc);
                }
            }
        } else {
            if (eyeExamTypeSelect) document.getElementById('price-eye-exam-type').textContent = '';
        }

        // 3. Contact Lens Exam (Optional)
        if (contactLensExamSelect && contactLensExamSelect.value !== 'None') {
            const selectedCLExamItem = priceListData.find(p => p.Item === contactLensExamSelect.value && p.Category === 'Contact Lens Exam');
            if (selectedCLExamItem) {
                const inputs = {
                    retail: selectedCLExamItem.Retail,
                    insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-contact-lens-exam`),
                    discount: isDecliningBalance ? 0 : getCleanValue(`discount-contact-lens-exam`),
                    copay: isDecliningBalance ? 0 : getCleanValue(`copay-contact-lens-exam`),
                };
                const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                summaryContent += createSummaryItemHTML('contact-lens-exam', selectedCLExamItem.Item, inputs, calc);
                document.getElementById('price-contact-lens-exam').textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
            }
        } else {
            if (contactLensExamSelect) document.getElementById('price-contact-lens-exam').textContent = '';
        }

        // 4. Retinal Fundus Photos (Optional Checkbox)
        if (retinalFundusPhotosCheckbox && retinalFundusPhotosCheckbox.checked) {
            const retinalItem = priceListData.find(p => p.Item === 'Retinal Fundus Photos' && p.Category === 'Retinal Fundus Photos');
            if (retinalItem) {
                const inputs = {
                    retail: retinalItem.Retail,
                    insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-retinal-fundus-photos`),
                    discount: isDecliningBalance ? 0 : getCleanValue(`discount-retinal-fundus-photos`),
                    copay: isDecliningBalance ? 0 : getCleanValue(`copay-retinal-fundus-photos`),
                };
                const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
                summaryContent += createSummaryItemHTML('retinal-fundus-photos', retinalItem.Item, inputs, calc);
                document.getElementById('price-retinal-fundus-photos').textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
            }
        } else {
            if (retinalFundusPhotosCheckbox) document.getElementById('price-retinal-fundus-photos').textContent = '';
        }

        // 5. Other Lens & Add-On Configuration categories (Rx, Lens Type, Material, etc.)
        categories.forEach(cat => {
            if (['Eye Exam Type', 'Contact Lens Exam', 'Retinal Fundus Photos', 'Add-Ons'].includes(cat.id)) return;
            if (cat.id === 'Protection' && insuranceType === 'VSP') return; 

            const catId = toId(cat.id);
            const priceEl = document.getElementById(`price-${catId}`);
            let selectedValue;
            const checkbox = document.getElementById(`checkbox-${catId}`);
            if (checkbox) {
                if(checkbox.checked) selectedValue = checkbox.dataset.itemName;
                else { if(priceEl) priceEl.textContent = ''; return; }
            } else {
                 const select = document.getElementById(`select-${catId}`);
                 if (select) selectedValue = select.value;
            }

            if (!selectedValue || selectedValue === "None") { if(priceEl) priceEl.textContent = ''; return; }
            
            const selectedItem = priceListData.find(p => p.Item === selectedValue);
            if (!selectedItem) return;

            const inputs = {
                retail: selectedItem.Retail,
                insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-${catId}`),
                discount: isDecliningBalance ? 0 : getCleanValue(`discount-${catId}`),
                copay: isDecliningBalance ? 0 : getCleanValue(`copay-${catId}`),
            };

            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) {
                errorFound = true;
                showErrorModal(`The final price for ${cat.label} cannot exceed its retail price.`);
                document.getElementById(`container-${catId}`).classList.add('error');
            }
            summaryContent += createSummaryItemHTML(catId, cat.label, inputs, calc);
            if (priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });
        
        // 6. Add-On rows
        document.querySelectorAll('.addon-row').forEach(row => {
            const rowId = row.id.split('-').pop();
            const select = document.getElementById(`select-addon-${rowId}`);
            const itemName = select.value;
            const priceEl = document.getElementById(`price-addon-${rowId}`);

            if (itemName === 'No Extras') {
                if(priceEl) priceEl.textContent = '';
                return; 
            }

            const selectedItem = priceListData.find(p => p.Item === itemName);
            if (!selectedItem) return;

            const inputs = {
                retail: selectedItem.Retail,
                insAllow: isDecliningBalance ? 0 : getCleanValue(`allowance-addon-${rowId}`),
                discount: isDecliningBalance ? 0 : getCleanValue(`discount-addon-${rowId}`),
                copay: isDecliningBalance ? 0 : getCleanValue(`copay-addon-${rowId}`),
            };

            const calc = calculateItem(inputs.retail, inputs.insAllow, inputs.discount, inputs.copay);
            if (calc.isError && !errorFound) {
                errorFound = true;
                showErrorModal(`The final price for ${itemName} cannot exceed its retail price.`);
                row.classList.add('error');
            }
            summaryContent += createSummaryItemHTML(`addon-${rowId}`, itemName, inputs, calc);
            if(priceEl) priceEl.textContent = formatCurrency(isDecliningBalance ? inputs.retail : calc.finalCost);
        });


        // Update summary items HTML
        if(summaryContent) {
            summaryItemsEl.innerHTML = summaryContent;
        }

        // Update the content of the Insurance Savings details section
        const insSavingsDetailsEl = document.getElementById('summary-ins-svgs-details');
        if (insSavingsDetailsEl) {
            if (isDecliningBalance) {
                const globalAllowance = getCleanValue('global-allowance');
                const globalDiscount = getCleanValue('global-discount');
                // Calculate the discount amount based on (Retail Total - Global Allowance) * (Global Discount / 100)
                const calculatedDiscountAmount = (totalRetail - globalAllowance) * (globalDiscount / 100);

                insSavingsDetailsEl.innerHTML = `
                    <div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Global Allowance</span><span>-${formatCurrency(globalAllowance)}</span></div>
                    <div class="flex justify-between text-xs pt-1"><span>Global Discount (${globalDiscount}%)</span><span>-${formatCurrency(calculatedDiscountAmount)}</span></div>
                `;
                insSavingsDetailsEl.classList.add('open'); 
            } else {
                insSavingsDetailsEl.innerHTML = ''; 
                insSavingsDetailsEl.classList.remove('open'); 
            }
        }

        document.getElementById('summary-retail').textContent = formatCurrency(totalRetail);
        document.getElementById('summary-ins-svgs').textContent = formatCurrency(totalInsSvgs);
        document.getElementById('summary-final-cost').textContent = formatCurrency(totalFinalCost);
    }

    function createSummaryItemHTML(id, title, inputs, outputs) {
        let discountCalcAmount; 
        const insuranceType = document.getElementById('insurance-type-select').value;
        const isDecliningBalance = (insuranceType === 'Declining Balance');

        if (id === 'frame') {
            discountCalcAmount = (inputs.retail - inputs.insAllow) * (inputs.discount / 100);
        } else {
            discountCalcAmount = inputs.retail * (inputs.discount / 100);
        }
        
        let copayHTML = '';
        if (inputs.copay > 0) { 
             copayHTML = `<div class="flex justify-between text-xs pt-1"><span>Co-Pay</span><span>+${formatCurrency(inputs.copay)}</span></div>`;
        }

        return `
            <div class="border-b border-gray-200 pb-1">
                <div class="summary-item-header flex justify-between items-center" onclick="toggleDetails('${id}')">
                    <span class="font-medium">${title}</span>
                    <span class="font-semibold">${formatCurrency(isDecliningBalance ? inputs.retail : outputs.finalCost)}</span>
                </div>
                <div id="details-${id}" class="summary-item-details bg-gray-50 rounded px-3 text-gray-600">
                    <div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Retail</span><span>${formatCurrency(inputs.retail)}</span></div>
                    ${!isDecliningBalance ? `<div class="flex justify-between text-xs border-b border-gray-200 py-1"><span>Ins. Allowance</span><span>-${formatCurrency(inputs.insAllow)}</span></div>` : ''}
                    ${!isDecliningBalance ? `<div class="flex justify-between text-xs ${inputs.copay > 0 ? 'border-b border-gray-200 py-1' : 'pt-1'}"><span>Discount (${inputs.discount}%)</span><span>-${formatCurrency(discountCalcAmount)}</span></div>` : ''}
                    ${!isDecliningBalance ? copayHTML : ''}
                </div>
            </div>
        `;
    }

    window.toggleDetails = function(id) {
        const detailsEl = document.getElementById(`details-${id}`);
        if(detailsEl) {
            detailsEl.classList.toggle('open');
        }
    }

    function resetCalculator() {
        document.querySelectorAll('.config-input, #customer-name, #global-allowance, #global-discount').forEach(el => el.value = ''); 
        document.querySelectorAll('.config-option').forEach(el => {
            if (el.tagName === 'SELECT') {
                el.selectedIndex = 0; 
            } else if (el.type === 'checkbox') {
                el.checked = false; 
            }
        });

        document.getElementById('addons-repeater-container').innerHTML = '';
        addonCounter = 0; 

        const edgePolishCheckbox = document.getElementById('checkbox-edge-polish');
        if (edgePolishCheckbox) { 
            edgePolishCheckbox.checked = true;
        }
        // Ensure eye exam type and contact lens exam dropdowns reset to "None"
        const eyeExamTypeSelect = document.getElementById('select-eye-exam-type');
        if (eyeExamTypeSelect) eyeExamTypeSelect.value = 'None';
        const contactLensExamSelect = document.getElementById('select-contact-lens-exam');
        if (contactLensExamSelect) contactLensExamSelect.value = 'None';
        const retinalFundusPhotosCheckbox = document.getElementById('checkbox-retinal-fundus-photos');
        if (retinalFundusPhotosCheckbox) retinalFundusPhotosCheckbox.checked = false;


        updateCalculations();
    }

    function initializeCalculator() {
        buildInputs();
        document.getElementById('reset-button').addEventListener('click', resetCalculator);
        document.getElementById('save-quote-button').addEventListener('click', () => {
            console.log("Quote saved (placeholder).");
        });

        // Attach event listeners to all relevant inputs including new global ones and exam inputs
        document.querySelectorAll('#customer-name, #insurance-type-select, #frame-retail-price, #allowance-frame, #discount-frame, #global-allowance, #global-discount, #select-eye-exam-type, #select-contact-lens-exam, #checkbox-retinal-fundus-photos, #allowance-eye-exam-type, #discount-eye-exam-type, #copay-eye-exam-type, #allowance-contact-lens-exam, #discount-contact-lens-exam, #copay-contact-lens-exam, #allowance-retinal-fundus-photos, #discount-retinal-fundus-photos, #copay-retinal-fundus-photos').forEach(el => {
            el.addEventListener('input', updateCalculations);
             if (el.classList.contains('dollar-format') || el.classList.contains('percent-format')) {
                el.addEventListener('focus', onFocus);
                el.addEventListener('blur', onBlur);
            }
        });

        // The insurance type select already has a change listener, but ensure it's attached.
        // It's also covered by the querySelectorAll above, but explicit is fine.
        document.getElementById('insurance-type-select').addEventListener('change', updateCalculations);

        updateCalculations();
    }

    // --- INITIALIZATION ---
    checkUser();
    // fetchData() is now called inside checkUser() after user is confirmed authenticated
</script>
</body>
</html>
